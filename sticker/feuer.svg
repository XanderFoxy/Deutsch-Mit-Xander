<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<style>
  * { transform-box: fill-box; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  .fl { animation: lodern 0.66s ease-in-out infinite; }
  .fl2 { animation: lodern2 0.48s ease-in-out infinite; }
  @keyframes lodern { 0%,100%{transform:scaleY(1) scaleX(1)} 50%{transform:scaleY(1.08) scaleX(.94)} }
  @keyframes lodern2 { 0%,100%{transform:scaleY(.92) translateY(2px)} 50%{transform:scaleY(1.1) translateY(-2px)} }
</style>
