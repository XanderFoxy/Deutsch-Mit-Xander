<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<style>
  * { transform-box: fill-box; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  .st { animation: dreh 2.6s ease-in-out infinite; }
  .fk { animation: funkel 1.3s ease-in-out infinite; }
  @keyframes dreh { 0%,100%{transform:rotate(-10deg) scale(.96)} 50%{transform:rotate(10deg) scale(1.05)} }
  @keyframes funkel { 0%,100%{opacity:0;transform:scale(.5)} 50%{opacity:1;transform:scale(1.2)} }
</style>
