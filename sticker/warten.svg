<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<style>
  * { transform-box: fill-box; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  .su { animation: kipp 4s ease-in-out infinite; }
  .ob { animation: leer 4s linear infinite; transform-origin: 50% 0; }
  .un { animation: voll 4s linear infinite; transform-origin: 50% 100%; }
  @keyframes kipp { 0%,88%{transform:rotate(0)} 96%,100%{transform:rotate(180deg)} }
  @keyframes leer { 0%{transform:scaleY(1)} 85%,100%{transform:scaleY(.05)} }
  @keyframes voll { 0%{transform:scaleY(.05)} 85%,100%{transform:scaleY(1)} }
</style>
