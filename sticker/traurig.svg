<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<style>
  * { transform-box: fill-box; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  .kopf { animation: senkt 3s ease-in-out infinite; }
  .mu { animation: zuck 3s ease-in-out infinite; }
  @keyframes senkt { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(4px) rotate(-3deg)} }
  @keyframes zuck { 0%,100%{transform:translateY(0)} 50%{transform:translateY(2px)} }
</style>
