      <path d="M30 42 Q32 28 44 28 Q56 28 58 42 Q54 35 44 35 Q34 35 30 42 Z" fill="#6b4a2f" opacity=".9"/>
      <circle cx="39.2" cy="42.6" r="1.9" fill="#4a3526"/>
      <circle cx="48.8" cy="42.6" r="1.9" fill="#4a3526"/>
      <path d="M39.5 49 q4.5 3.8 9 0"
