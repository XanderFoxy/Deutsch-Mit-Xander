      <rect x="85.5" y="73" width="4" height="6" rx="2"
       fill="#f3b57b" stroke="rgba(60,40,20,.32)" stroke-width="1.2"
       transform="rotate(-66 87.5 76)"/>
    </g>
</g>
<g class="hz"><path d="M60 14 C50 6 44 14 48 21 C51 26 60 30 60 30 C60 30 69 26 72 21 C76 14 70 8 60 16 Z" fill="#e0546a"/></g>
</svg>