      <ellipse cx="84.7" cy="50.2" rx="2.6" ry="1.7" fill="#e0546a" opacity=".3"/>
    </g>
  <!-- ihr Arm geht HINTER der linken Figur um deren Rücken -->
  <path d="M63.2 67.3 Q45.3 75.9 27.4 74.5 L28.6 81.5 Q46.7 84.1 64.8 76.7 Z" fill="#e8a768" stroke="rgba(60,40,20,.32)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- vorn: die linke Figur -->
  <rect x="39.5" y="56" width="9" height="12" rx="3.5" fill="#f3b57b" stroke="rgba(60,40,20,.32)" stroke-width="1.4"/>
  <path d="
