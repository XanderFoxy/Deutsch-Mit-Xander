<style>
  * { transform-box: fill-box; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  .um { animation: druecken 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
  .hz { animation: hoch 2.6s ease-in-out infinite; }
  @keyframes druecken { 0%,100%{transform:scale(1,1)} 44%{transform:scale(.95,1.035)} 62%{transform:scale(.985,1.01)} }
  @keyframes hoch { 0%,20%{opacity:0;transform:translateY(10px) scale(.6)} 50%{opacity:1;transform:translateY(-2px) scale(1.1)} 100%{opacity:0;transform:translateY(-16px) scale(.9)} }
</style>
