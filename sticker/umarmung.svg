  <g transform="rotate(12 94 75)">
      <path d="M88 70 Q99 68 100 75
               Q100 81 93 81
               Q87 80 88 70 Z"
        fill="#f3b57b" stroke="rgba(60,40,20,.32)" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="88.5" y="66.5" width="4.2" height="7" rx="2.1"
       fill="#f3b57b" stroke="rgba(60,40,20,.32)" stroke-width="1.2"
       transform="rotate(-12 90.6 70)"/>
      <rect x="92.8" y="65.8" width="4.4" height="8" rx="2.2"
       fill="#f3b57b" stroke="rgba(60,40,20,.32)" stroke-width="1.2"
