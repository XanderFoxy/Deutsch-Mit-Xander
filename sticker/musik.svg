<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<style>
  * { transform-box: fill-box; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  .n1 { animation: tanz 1.5s ease-in-out infinite; }
  .n2 { animation: schweb 2.4s ease-in-out infinite; }
  @keyframes tanz { 0%,100%{transform:rotate(-5deg) translateY(0)} 50%{transform:rotate(5deg) translateY(-4px)} }
  @keyframes schweb { 0%{opacity:0;transform:translateY(14px) scale(.7)} 30%{opacity:1} 100%{opacity:0;transform:translateY(-22px) scale(1.15)} }
</style>
