<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .hand { animation: winken 1.25s ease-in-out infinite; transform-box: view-box; transform-origin: 54% 92%; }
  .str  { animation: strich 1.25s ease-in-out infinite; transform-box: view-box; transform-origin: 50% 50%; }
  @keyframes winken {
    0%   { transform: rotate(-17deg) translateY(0); }
    24%  { transform: rotate(20deg) translateY(-1.5px); }
    48%  { transform: rotate(-13deg) translateY(0); }
    72%  { transform: rotate(17deg) translateY(-2.5px); }
    100% { transform: rotate(-17deg) translateY(0); }
  }
  @keyframes strich {
    0%,100% { opacity:.12; transform: translateX(-5px); }
    24%     { opacity:.9;  transform: translateX(4px); }
    48%     { opacity:.2;  transform: translateX(-4px); }
    72%     { opacity:.8;  transform: translateX(3px); }
  }
</style>
