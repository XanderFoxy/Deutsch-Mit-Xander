<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" width="220" height="130">
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .l { animation: klatschL 0.62s linear infinite; transform-box: view-box; transform-origin: 26% 92%; }
  .r { animation: klatschR 0.62s linear infinite; transform-box: view-box; transform-origin: 74% 92%; }
  .funk { animation: funk 0.62s linear infinite; transform-box: view-box; transform-origin: 50% 44%; }
  @keyframes klatschL {
    0%   { animation-timing-function: cubic-bezier(.5,0,.95,.4);
           transform: translateX(-11px) rotate(-6deg) scaleX(1); }
    42%  { animation-timing-function: cubic-bezier(.1,.9,.3,1);
           transform: translateX(1px) rotate(1deg) scaleX(.88); }
    48%  { transform: translateX(0) rotate(0) scaleX(.98); }
    56%  { animation-timing-function: cubic-bezier(.4,0,.6,1);
           transform: translateX(-4px) rotate(-2deg) scaleX(1.03); }
    100% { transform: translateX(-11px) rotate(-6deg) scaleX(1); }
  }
  @keyframes klatschR {
    0%   { animation-timing-function: cubic-bezier(.5,0,.95,.4);
           transform: translateX(11px) rotate(6deg) scaleX(1); }
    42%  { animation-timing-function: cubic-bezier(.1,.9,.3,1);
           transform: translateX(-1px) rotate(-1deg) scaleX(.88); }
    48%  { transform: translateX(0) rotate(0) scaleX(.98); }
    56%  { animation-timing-function: cubic-bezier(.4,0,.6,1);
           transform: translateX(4px) rotate(2deg) scaleX(1.03); }
    100% { transform: translateX(11px) rotate(6deg) scaleX(1); }
  }
  @keyframes funk { 0%,40%{opacity:0; transform:scale(.4)} 44%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:scale(1.6)} }
</style>
