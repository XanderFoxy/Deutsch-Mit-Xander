<title>SYNQUENZER</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0e11; --chassis:#15171b; --chassis-2:#1c1f25; --chassis-3:#262a33; --line:#2d323c;
  --text:#ece8df; --text-dim:#9aa0aa; --text-faint:#5d636e; --sel:#f4f1ea;
  --play:#35d07f; --play-dim:#1b4d34; --rec:#ff4538; --rec-dim:#4f1a17;
  --amber:#ffb22e; --amber-dim:#4a3510; --amber-glow:rgba(255,178,46,.35);
  --t1:#4cc9f0; --t2:#8b9cff; --t3:#2dd4bf; --t4:#fb7185; --t5:#e879f9;
  --t1a:rgba(76,201,240,.22); --t2a:rgba(139,156,255,.22); --t3a:rgba(45,212,191,.22); --t4a:rgba(251,113,133,.22); --t5a:rgba(232,121,249,.22);
  --key-w:#ece6d8; --key-w-dn:#cfc6b2; --key-b:#1a1b1f; --key-b-dn:#3a3d45;
  --key-w-hi:#f7f3ea; --key-w-lo:#d8d0be; --key-b-hi:#33363d; --key-b-lo:#0e0f12;
  --key-w-tr:#f5dcab; --key-b-tr:#3b2a0e; --key-tr-on:#ffb22e; --key-w-tr-hi:#fbe9c8; --key-b-tr-hi:#5a4019;
  --key-w-lt:#fac46a; --key-b-lt:#b9801f; --key-label:rgba(20,20,22,.5);
  --p1:#ff6b4a; --p2:#ffd23f; --p3:#9ef01a; --p4:#4cc9f0; --p5:#3a86ff; --p6:#c77dff; --p7:#f15bb5; --p8:#2dd4bf;
  --led-off:#2a2e36; --shadow:rgba(0,0,0,.6); --hi:rgba(255,255,255,.06); --hi-2:rgba(255,255,255,.12);
  --backdrop:rgba(5,6,8,.62); --lcd:#08090b; --ink:#141416; --panel-edge:#000;
  --r:8px; --r-s:5px;
  --font-ui:"Barlow Semi Condensed","Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:500 14px/1.2 var(--font-ui);position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;line-height:1;text-align:center}
button:focus{outline:none}
button:focus-visible,.knob:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
input,select,textarea{font-size:16px;font-family:var(--font-ui);color:var(--text);-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
svg{display:block}
[hidden]{display:none!important}
.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);line-height:1.1}
.rb{background:linear-gradient(var(--chassis-2),var(--chassis));border:1px solid var(--line);border-radius:var(--r-s);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--shadow);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:background-color .12s,box-shadow .12s,color .12s,border-color .12s}
.rb:active,.rb.on,.rb.pressed{box-shadow:inset 0 2px 4px var(--shadow);background:linear-gradient(var(--chassis),var(--chassis-2))}
.rb:disabled{opacity:.4}
@keyframes blink{50%{opacity:.35}}
@keyframes ciFade{0%{opacity:1;transform:scale(1)}100%{opacity:.15;transform:scale(.92)}}
@keyframes padFlash{0%{opacity:1}100%{opacity:0}}

/* ---------- app grid ---------- */
#app{position:absolute;inset:0;display:grid;width:100%;max-width:100vw;height:100vh;height:100dvh;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg);transition:grid-template-rows .15s ease-out}
#top{grid-area:top}#gridArea{grid-area:clips}#side{grid-area:side}#strip{grid-area:strip}#carrier{grid-area:carrier}#modebar{grid-area:mode}#kbArea{grid-area:kb}
@media (orientation:portrait){
  #app{grid-template-columns:minmax(0,1fr);
    grid-template-rows:52px minmax(0,1fr) 48px 56px 52px clamp(170px,30vh,260px);
    grid-template-rows:52px minmax(0,1fr) 48px 56px 52px clamp(170px,30dvh,260px);
    grid-template-areas:"top" "clips" "strip" "carrier" "mode" "kb"}
  #app.sheet-open{grid-template-rows:52px minmax(0,1fr) 48px 56px 52px 170px}
  #app.sheet-open #carrier{visibility:hidden}
  #side{display:contents}
  .sheet.ed{grid-row:2/5;grid-column:1/-1}
  #clipSheet{grid-row:2/4;grid-column:1/-1}
  .lwonly{display:none!important}
}
@media (orientation:landscape){
  #app{grid-template-columns:96px minmax(0,1fr) 300px;
    grid-template-rows:44px minmax(0,1fr) clamp(110px,34vh,150px);
    grid-template-rows:44px minmax(0,1fr) clamp(110px,34dvh,150px);
    grid-template-areas:"top top top" "clips clips side" "mode kb kb"}
  #app.sheet-open{grid-template-rows:44px minmax(0,1fr) 110px}
  #side{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chassis);border-left:1px solid var(--panel-edge);overflow:hidden}
  .sheet.ed{grid-row:2;grid-column:1/-1}
  #clipSheet{grid-row:2;grid-column:1/3}
  .ponly{display:none!important}
}
@media (orientation:landscape) and (min-height:561px){
  #app{grid-template-columns:120px minmax(0,1fr) 340px;grid-template-rows:56px minmax(0,1fr) 190px}
  #app.sheet-open{grid-template-rows:56px minmax(0,1fr) 150px}
}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:5px;padding:4px 6px;min-width:0;overflow:hidden;background:linear-gradient(#191b20,#111316);border-bottom:1px solid var(--panel-edge);box-shadow:inset 0 -1px 0 var(--hi);position:relative;z-index:6}
.tb{flex:none;width:48px;height:44px;font-size:18px;position:relative}
.tb.sq{width:44px}
#bPlay .g-play{color:var(--play)}
#bPlay .g-stop{display:none;color:var(--text)}
#app.playing #bPlay .g-play{display:none}
#app.playing #bPlay .g-stop{display:inline}
#app.tailwin:not(.playing) #bPlay .g-play{display:none}
#app.tailwin:not(.playing) #bPlay .g-stop{display:inline;color:var(--text-dim)}
#app.playing #bPlay{border-color:var(--play-dim);box-shadow:inset 0 2px 4px var(--shadow),0 0 10px rgba(53,208,127,.25)}
#bPlay .spk{position:absolute;right:2px;top:2px;width:12px;height:12px;display:none;color:var(--text-dim)}
#app.audio-off #bPlay .spk{display:block}
#bRec{flex-direction:column;gap:2px}
#bRec .dot{color:var(--rec);font-size:16px;line-height:1}
#bRec .sub{font:600 8px/1 var(--font-num);color:var(--text-dim);letter-spacing:.04em}
#bRec.armed{animation:blink .25s infinite;border-color:var(--rec)}
#bRec.active{background:var(--rec-dim);border-color:var(--rec);box-shadow:0 0 12px rgba(255,69,56,.45),inset 0 2px 4px var(--shadow)}
#bRec.active .sub{color:var(--text)}
.takt{flex:1 1 auto;min-width:0;max-width:210px;height:44px;display:flex;align-items:center;gap:8px;padding:0 9px;background:var(--lcd);border:1px solid var(--panel-edge);border-radius:var(--r-s);box-shadow:inset 0 1px 6px rgba(0,0,0,.85),0 1px 0 var(--hi);position:relative;overflow:hidden}
.takt .tcol{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:1px}
.takt .lbl{font-size:9px;color:var(--text-faint)}
#taktVal{font:700 28px/1 var(--font-num);color:var(--text);letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
#taktVal.dim{color:var(--text-faint)}
#taktVal.ci{color:var(--rec)}
.leds{display:flex;align-items:center;gap:5px;margin-left:auto;flex:none}
.leds i{width:8px;height:8px;border-radius:50%;background:var(--led-off);display:block;flex:none}
.leds i:first-child{width:11px;height:11px}
.leds i.on{background:var(--play);box-shadow:0 0 8px var(--play)}
.leds i:first-child.on{background:var(--rec);box-shadow:0 0 8px var(--rec)}
.takt.flash::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--sel);box-shadow:0 0 6px var(--sel)}
@media (orientation:portrait){
  .takt{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:0 8px}
  .takt .trow{display:flex;align-items:center;gap:6px}
  .takt .leds{margin-left:0;gap:4px}
}
.takt .trow{display:contents}
@media (orientation:portrait){.takt .trow{display:flex}}
#bBpm{flex:none;height:44px;min-width:56px;padding:0 6px;flex-direction:column;gap:3px}
#bBpm .lbl{font-size:9px}
#bpmVal{font:700 18px/1 var(--font-num)}
#bMetro{font-size:20px}
#bMetro.on{color:var(--play);text-shadow:0 0 8px var(--play);border-color:var(--play-dim)}
.chipT{flex:none;height:36px;padding:0 10px;font:700 11px/1 var(--font-ui);letter-spacing:.06em;white-space:nowrap}
.chipT b{font-family:var(--font-num);font-weight:700;margin-left:4px;color:var(--text)}
.chipT{color:var(--text-dim)}
.spacer{flex:1 1 0;min-width:0}
#bMenu{font-size:22px}
#app.wide .tb{height:48px}
/* logo: inline vector, never filtered or transformed, integer CSS px height (§13.1) */
.tlogo{flex:none;display:flex;align-items:center;justify-content:center;height:44px;width:50px;pointer-events:none}
.tlogo svg,.clogo svg,.mlogo svg{display:block;width:auto;max-width:none;filter:none}
.tlogo svg{height:36px}
@media (orientation:portrait){
  #top{gap:4px;padding:4px 8px}
  .tb,.tb.sq{width:44px}
  #bMetro,#bMenu{width:40px}
  .takt{flex:0 0 76px;width:76px;max-width:none;padding:0 6px}
  .takt .lbl{font-size:9px;letter-spacing:.04em}
  .takt .trow{gap:4px}
  .takt .leds{gap:2px}
  .takt .leds i{width:7px;height:7px}
  .takt .leds i:first-child{width:10px;height:10px}
  #taktVal{font-size:26px}
  #taktVal.long{font-size:20px}
  #bBpm{flex:0 0 52px;width:52px;min-width:0;padding:0}
}
@media (orientation:portrait) and (max-width:389px){
  #top{gap:2px;padding:4px 6px}
  #bBpm{flex-basis:48px;width:48px}
  #bMetro,#bMenu{width:36px}
}
@media (orientation:portrait) and (max-width:359px){.tlogo{display:none}}
@media (orientation:landscape){.tlogo{width:46px;height:40px}.tlogo svg{height:34px}}
@media (orientation:landscape) and (min-height:561px){.tlogo{width:56px;height:48px}.tlogo svg{height:40px}}
#app.loading .takt::after{content:"";position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--text-faint);border-top-color:var(--sel);animation:spin .7s linear infinite}
#app.loading #gridArea,#app.loading #side,#app.loading #modebar,#app.loading #kbArea,#app.loading #top button{pointer-events:none;opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- clip grid ---------- */
#gridArea{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#14161a,var(--bg))}
#clipGrid{flex:1 1 auto;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(84px,1.7fr) repeat(4,minmax(46px,1fr)) 40px;grid-template-rows:44px repeat(5,minmax(26px,1fr));gap:3px;padding:4px 8px}
@media (orientation:landscape){#clipGrid{grid-template-rows:44px repeat(5,minmax(0,1fr));gap:2px 3px;padding:3px 6px}}
@media (orientation:landscape) and (max-height:370px){#clipGrid{grid-template-rows:32px repeat(5,minmax(0,1fr))}}
@media (orientation:landscape) and (max-width:759px) and (max-height:560px){
  #app{grid-template-columns:84px minmax(0,1fr) 260px}
  #chipQ,#chipLen{display:none!important}           /* [FANG] stays (§2.2: only Q and LÄNGE move to the popover) */
  #clipGrid{grid-template-columns:minmax(60px,1.2fr) repeat(4,minmax(34px,1fr)) 30px;padding:3px 4px}
  .chipT{height:34px;padding:0 6px;font-size:10px;letter-spacing:.02em}
  .chipT b{margin-left:3px}
  #strip{gap:4px;padding:3px 5px}
  #stDot{display:none}
  #stSub{display:none}
  #stName{font-size:11px;letter-spacing:.02em}
  #strip .sbtn{padding:0 6px}
  #bKlang{min-width:52px;padding:0 6px}
  #bFolgt .ck{display:none}
  #clipGrid .th .nm{font-size:11px;letter-spacing:0}
}
@media (orientation:landscape) and (min-height:561px){#clipGrid{grid-template-rows:44px repeat(5,minmax(30px,64px));gap:4px;padding:6px 10px;align-content:start}}
.corner{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:0 4px 5px 6px;min-width:0;min-height:0;overflow:hidden}
.corner .lbl{font-size:9px;letter-spacing:.14em;color:var(--text-faint)}
.corner .clogo{display:none;pointer-events:none}
@media (orientation:portrait) and (max-width:359px){
  .corner{justify-content:center;align-items:center;padding:0}
  .corner .lbl{display:none}
  .corner .clogo{display:flex;align-items:center;justify-content:center}
  .corner .clogo svg{height:36px}
}
@media (orientation:portrait) and (max-width:359px) and (max-height:700px){.corner .clogo svg{height:28px}}
.scn{min-width:0;min-height:0;height:100%;font:700 14px/1 var(--font-ui);gap:6px;color:var(--text)}
.scn .tri{font-size:10px;color:var(--play)}
.scn.full{border-color:var(--play);box-shadow:inset 0 0 0 1px var(--play),0 0 8px rgba(53,208,127,.25)}
.scn.q{animation:blink .25s infinite;border-color:var(--play)}
.stp{min-width:0;min-height:0;height:100%;font-size:12px;color:var(--text-dim)}
.stp.all{color:var(--text);font-size:13px}
.th{position:relative;min-width:0;min-height:0;height:100%;text-align:left;padding:3px 4px 3px 9px;background:linear-gradient(var(--chassis-2),var(--chassis));border:1px solid var(--line);border-radius:var(--r-s);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;overflow:hidden;box-shadow:inset 0 1px 0 var(--hi)}
.th .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc)}
.th .nm{font:700 12px/1 var(--font-ui);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.th .sb{font-size:10px;line-height:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 14px)}
.th .fb{position:absolute;right:4px;bottom:4px;font-size:11px;line-height:1;color:var(--text-faint);font-weight:700}
.th .fb.act{color:var(--amber);text-shadow:0 0 6px var(--amber-glow)}
.th .fb.fix{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim)}
.th.sel{background:linear-gradient(var(--chassis-3),var(--chassis-2));border-color:var(--text-faint);box-shadow:inset 0 0 0 1px var(--tc)}
.th.muted .nm{opacity:.45;text-decoration:line-through}
.slot{position:relative;min-width:0;min-height:0;border:1px dashed var(--line);border-radius:6px;overflow:hidden;background:transparent;touch-action:none}
.slot::after{content:"";position:absolute;inset:0;border-radius:6px;border:2px solid transparent;pointer-events:none}
.slot.filled{border:1px solid rgba(255,255,255,.05);background:var(--ta)}
.slot.sel::before{content:"";position:absolute;inset:0;border-radius:6px;border:2px solid var(--sel);pointer-events:none;z-index:2}
.slot.sel::after{inset:3px;border-radius:4px}
.slot.playing::after{border-color:var(--play)}
.slot.queued::after{border-color:var(--play);animation:blink .25s infinite}
.slot.qstop::after{border-color:var(--text-faint);animation:blink .25s infinite}
.slot.armed::after{border-color:var(--rec);animation:blink .25s infinite}
.slot.rec{background:var(--rec-dim)}
.slot.rec::after{border-color:var(--rec)}
.slot.muted{opacity:.55}
.slot.assigned::after{border-color:var(--play-dim)}
.slot .mini{position:absolute;inset:3px 3px 14px 3px;opacity:.6;pointer-events:none}
.slot .mini svg{width:100%;height:100%}
.slot .mini rect{fill:var(--tc)}
.slot .gl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-faint);pointer-events:none}
.slot.sel:not(.filled) .gl{color:var(--sel)}
.slot .gl.rd,.slot.sel:not(.filled) .gl.rd{color:var(--rec);font-size:16px}
.slot .ln{position:absolute;left:4px;bottom:3px;font:600 10px/1 var(--font-num);color:var(--text-dim);pointer-events:none}
.slot .kbg{position:absolute;right:3px;top:3px;z-index:1;font:700 9px/1 var(--font-ui);padding:2px 3px;border-radius:3px;background:rgba(0,0,0,.45);color:var(--text);pointer-events:none}
.slot .tx{position:absolute;right:4px;bottom:3px;font:700 10px/1 var(--font-num);color:var(--text);pointer-events:none;white-space:nowrap}
.slot.rec .tx{color:var(--rec)}
.slot .pg{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tc);transform-origin:0 50%;transform:scaleX(0);pointer-events:none;will-change:transform;z-index:3}
.slot.sel .pg{left:3px;right:3px;bottom:3px}
.slot.sel .ln{left:7px;bottom:6px}
.slot.sel .tx{right:7px;bottom:6px}
.slot.sel .mini{inset:6px 6px 17px 6px}
.slot.rec .pg{background:var(--rec)}
#hint{flex:none;display:flex;align-items:center;gap:8px;margin:0 8px 6px;padding:6px 6px 6px 10px;border-radius:var(--r-s);background:linear-gradient(90deg,var(--amber-dim),#2a2214);border:1px solid #6b4c16;color:var(--text);font-size:12px;line-height:1.25;min-height:34px}
#hint span{flex:1;min-width:0}
#hint button{flex:none;width:40px;height:34px;border-radius:4px;color:var(--text-dim);font-size:16px}
@media (orientation:landscape){#hint{margin:0 6px 4px;min-height:28px;padding:3px 4px 3px 8px;font-size:11px}#hint button{width:28px;height:26px}}
#countin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:rgba(13,14,17,.55);z-index:8}
#countin.show{display:flex}
#countin .n{font:700 120px/1 var(--font-num);color:var(--rec);text-shadow:0 0 30px rgba(255,69,56,.45)}
#countin .n.go{animation:ciFade .5s ease-out forwards}
#countin .lbl{font-size:12px;color:var(--text);letter-spacing:.2em;margin-top:6px}
@media (orientation:landscape) and (max-height:560px){#countin .n{font-size:96px}}

/* ---------- side / strip / carrier ---------- */
#strip{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--chassis);border-top:1px solid var(--panel-edge);min-width:0;min-height:0}
#stDot{width:10px;height:10px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc);flex:none}
.stn{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
#stName{font:700 13px/1 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stSub{font-size:11px;line-height:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn{height:44px;padding:0 10px;font:700 12px/1 var(--font-ui);letter-spacing:.06em;flex:none}
#bKlang{padding:0 12px;min-width:64px}
#bFolgt .ck{display:inline-block;width:12px;color:var(--text-faint)}
#bFolgt.on{color:var(--amber);border-color:#6b4c16}
#bFolgt.on .ck{color:var(--amber)}
#stLock{font-size:11px;color:var(--text-dim);white-space:nowrap;flex:none;padding:0 4px}
#bMute,#bUndo{width:44px;padding:0;font-size:15px}
#bMute.on{color:var(--rec);border-color:var(--rec-dim)}
#carrier{display:grid;grid-template-columns:72px minmax(0,1fr) 56px 72px;grid-template-areas:"mode ro latch orig";gap:6px;padding:6px 8px;align-items:center;background:var(--chassis);border-top:1px solid var(--panel-edge);min-width:0;min-height:0;transition:box-shadow .15s}
#bHMode{grid-area:mode;height:44px;font:700 12px/1 var(--font-ui);letter-spacing:.04em;padding:0 4px;white-space:nowrap}
#bHMode .car{font-size:9px;color:var(--text-dim)}
#readout{grid-area:ro;min-width:0;height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 8px;background:var(--lcd);border:1px solid var(--panel-edge);border-radius:var(--r-s);box-shadow:inset 0 1px 6px rgba(0,0,0,.85);text-align:left;overflow:hidden}
#readout .l1{display:flex;align-items:center;gap:5px;min-width:0;height:11px}
#carLabel{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#carLabel.q{color:var(--amber);letter-spacing:.02em;text-transform:none;font-size:10px;font-weight:700}
#carLabel.hintS{color:var(--amber);opacity:.8;text-transform:none;letter-spacing:0;font-size:10px}
#carLabel.deg{color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.04em}
#carLabel.own{color:var(--amber);opacity:.85;text-transform:none;letter-spacing:0;font-size:10px;font-weight:700}   /* P: „1 Clip eigene Tonart“ in full */
#carRing{width:11px;height:11px;flex:none;display:none}
#carRing.show{display:block}
#carRing circle{fill:none;stroke-width:3}
#carRing .rb0{stroke:var(--amber-dim)}
#carRing .rb1{stroke:var(--amber);stroke-dasharray:28.27;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:50% 50%}
#readout .l2{display:flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap}
#carVal{font:700 30px/1 var(--font-ui);color:var(--amber);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;min-width:0;filter:drop-shadow(0 0 6px var(--amber-glow))}
#carVal.orig{color:var(--text-dim);font-size:20px;letter-spacing:.06em;filter:none}
#carShift{font:700 16px/1 var(--font-num);color:var(--amber);flex:none}
#carShift.deg{font:600 12px/1.2 var(--font-ui);letter-spacing:.01em;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#carShift.own{font:600 9px/1.1 var(--font-ui);letter-spacing:.02em;text-transform:uppercase;color:var(--amber);opacity:.85;flex:1 1 0;min-width:0;white-space:normal;align-self:center}
#carLock{font-size:12px;flex:none;display:none}
#carLock.show{display:inline}
#bLatch{grid-area:latch;height:44px;flex-direction:column;gap:2px;font-size:13px}
#bLatch .lbl{font-size:8px}
#bLatch.on{color:var(--amber);border-color:#6b4c16;box-shadow:inset 0 2px 4px var(--shadow),0 0 8px var(--amber-glow)}
#bLatch.on .lbl{color:var(--amber)}
#bOrig{grid-area:orig;height:44px;font:700 11px/1 var(--font-ui);letter-spacing:.06em}
#bOrig.act{color:var(--text);border-color:var(--text-faint)}
#hist{grid-area:hist;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:none;touch-action:pan-x}
#hist::-webkit-scrollbar{display:none}
.hc{flex:none;height:28px;min-width:40px;padding:0 8px;font:700 12px/1 var(--font-ui);color:var(--text-dim)}
.hc.cur{color:var(--amber);border-color:#6b4c16}
.hc.empty{opacity:.5;pointer-events:none;border-style:dashed}
#app.carrier-on #carrier{box-shadow:inset 0 0 0 1px rgba(255,178,46,.25)}
@media (orientation:landscape){
  #carrier{order:1;border-top:0;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto 44px 30px;grid-template-areas:"ro ro ro" "mode latch orig" "hist hist hist";padding:6px 8px;gap:6px;align-content:start}
  #readout{height:52px}
  #strip{order:2;margin-top:auto;border-top:1px solid var(--panel-edge)}
  #bHMode,#bLatch,#bOrig{width:100%;height:44px}
  #modeSeg button{min-height:0}
  .oct{min-height:0}
}
@media (orientation:portrait){#hist{display:none}#readout{cursor:pointer;height:48px;gap:2px}#readout .l1{height:12px}#carrier{padding:4px 8px}}
@media (orientation:landscape) and (max-height:430px){
  #carrier{grid-template-rows:auto 44px 28px;gap:5px;padding:5px 6px}
  #readout{height:48px}
  #strip{padding:3px 6px;gap:4px}
  #strip .sbtn{height:44px}
  #bMute,#bUndo{width:36px}
  .hc{height:26px}
}
@media (orientation:landscape) and (max-height:370px){
  #carrier{grid-template-rows:auto 44px 22px;gap:4px;padding:4px 6px}
  .hc{height:22px;font-size:11px;min-width:36px;padding:0 6px}
  #readout{height:44px}
}

/* ---------- mode bar ---------- */
#modebar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-areas:"dn seg up";gap:6px;padding:4px 8px;background:var(--chassis);border-top:1px solid var(--panel-edge);min-width:0;min-height:0;position:relative;z-index:3;transition:box-shadow .15s}
#octDn{grid-area:dn}#octUp{grid-area:up}
.oct{font-size:24px;color:var(--text-dim);height:100%;min-height:44px}
#modeSeg{grid-area:seg;display:flex;min-width:0;border-radius:var(--r);background:#0b0c0e;padding:0;gap:2px;box-shadow:0 0 0 1px var(--panel-edge),inset 0 1px 3px rgba(0,0,0,.7);touch-action:none;overflow:hidden}
#modeSeg button{flex:1 1 0;min-width:0;min-height:44px;border-radius:7px;font:700 clamp(10px,3.1vw,13px)/1 var(--font-ui);letter-spacing:.01em;padding:0 3px;overflow:hidden;color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;touch-action:none;transition:background-color .12s,color .12s}
#modeSeg .led{width:8px;height:8px;border-radius:50%;background:var(--led-off);flex:none}
#app:not(.tr) #segPlay{background:linear-gradient(var(--chassis-3),var(--chassis-2));color:var(--text);box-shadow:inset 0 1px 0 var(--hi)}
#app:not(.tr) #segPlay .led{background:var(--play);box-shadow:0 0 8px var(--play)}
#app.tr #segTr{background:var(--amber);color:var(--ink)}
#app.tr #segTr .led{background:var(--ink)}
#app.mom #segTr{background:var(--amber-dim);color:var(--amber)}
#app.tr #modebar,#app.mom #modebar{box-shadow:0 0 0 1px var(--amber),0 0 18px var(--amber-glow)}
.trl .l1,.trl .l2{display:inline}
@media (orientation:landscape){
  #modebar{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr) 28px;grid-template-areas:"seg seg" "seg seg" "dn up";padding:4px;gap:4px;border-right:1px solid var(--panel-edge)}
  #modeSeg{flex-direction:column}
  #modeSeg button{font-size:11px;flex-direction:column;gap:3px;white-space:normal;min-height:0}
  .trl{display:flex;flex-direction:column;line-height:1.05}
  .trl .l1,.trl .l2{display:block}
  .oct{min-height:0;font-size:20px}
  #modeSeg .ico{display:none}
}
@media (orientation:landscape) and (min-height:561px){#modeSeg button{font-size:13px}#modeSeg .ico{display:inline}}

/* ---------- keyboard + pads ---------- */
#kbArea{position:relative;min-width:0;min-height:0;padding:6px 6px 5px;background:linear-gradient(#0b0c0f,#060708);border-top:1px solid var(--panel-edge);display:flex;flex-direction:column}
#kbWrap{position:relative;flex:1 1 auto;min-height:0}
#kb{position:absolute;inset:0;touch-action:none;--kb-target:37;overflow:hidden;border-radius:3px 3px 6px 6px;box-shadow:0 0 0 1px #000}
@media (orientation:landscape){#kb{--kb-target:46}}
@media (orientation:landscape) and (min-height:561px){#kb{--kb-target:52}}
#app.tr #kb,#app.mom #kb{box-shadow:0 0 0 1px var(--amber),0 0 14px var(--amber-glow)}
.key{position:absolute;top:0;pointer-events:none}
.key.w{bottom:0;background:linear-gradient(180deg,var(--key-w-hi) 0%,var(--key-w) 55%,var(--key-w-lo) 100%);border-left:1px solid rgba(0,0,0,.3);border-radius:0 0 5px 5px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,.5)}
.key.b{height:62%;background:linear-gradient(180deg,var(--key-b-hi) 0%,var(--key-b) 28%,var(--key-b-lo) 100%);border-radius:0 0 4px 4px;z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.6),inset 0 -3px 0 rgba(255,255,255,.07),inset 1px 0 0 rgba(255,255,255,.05)}
.key.w.dn{background:var(--key-w-dn);box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.key.b.dn{background:var(--key-b-dn)}
.key.lt::after{content:"";position:absolute;left:18%;right:18%;bottom:5px;height:3px;border-radius:2px;background:var(--amber);box-shadow:0 0 6px var(--amber-glow)}
.key.b.lt::after{bottom:4px}
.key.sp.w{background:linear-gradient(180deg,var(--key-w-tr-hi),var(--key-w-tr))}
.key.sp.b{background:linear-gradient(180deg,var(--key-b-tr-hi),var(--key-b-tr))}
.key.spl{border-left:2px solid var(--amber)}
#app.tr .key.w,#app.mom .key.w{background:linear-gradient(180deg,var(--key-w-tr-hi) 0%,var(--key-w-tr) 70%)}
#app.tr .key.b,#app.mom .key.b{background:linear-gradient(180deg,var(--key-b-tr-hi) 0%,var(--key-b-tr) 60%)}
#app.tr .key.w.lt,#app.mom .key.w.lt{background:var(--key-w-lt)}
#app.tr .key.b.lt,#app.mom .key.b.lt{background:var(--key-b-lt)}
#app.tr .key.lt::after,#app.mom .key.lt::after{display:none}
#app.tr .key.dn,#app.mom .key.dn{background:var(--key-tr-on);box-shadow:inset 0 0 14px rgba(255,255,255,.6),0 0 12px var(--amber-glow)}
.key .cl{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:600 10px/1 var(--font-num);color:var(--key-label)}
.key .rf{position:absolute;left:50%;bottom:24px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber);display:none}
#app.tr .key.ref .rf,#app.mom .key.ref .rf{display:block}
.key .gd{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:2px;pointer-events:none}
.key.b .gd{bottom:8px}
.key .gd i{width:6px;height:6px;border-radius:50%;display:block;box-shadow:0 0 4px rgba(0,0,0,.4)}
#kbLabel{position:absolute;left:10px;top:9px;z-index:5;display:none;pointer-events:none;font:700 9px/1 var(--font-ui);letter-spacing:.1em;color:var(--amber);background:rgba(20,15,6,.85);border:1px solid #6b4c16;border-radius:3px;padding:3px 6px}
#app.tr #kbLabel,#app.mom #kbLabel{display:block}
#app.drumpads #kbLabel{display:none}
#pads{position:absolute;inset:0;display:none;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:6px;touch-action:none}
@media (orientation:landscape){#pads{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:1fr}}
#app.drumpads #pads{display:grid}
#app.drumpads #kb{display:none}
.pad{position:relative;min-width:0;min-height:44px;border-radius:8px;background:linear-gradient(#262930,#1a1c21);border:1px solid #000;box-shadow:inset 0 1px 0 var(--hi),0 2px 0 #000;display:flex;align-items:flex-end;justify-content:flex-start;padding:8px;font:700 12px/1.1 var(--font-ui);letter-spacing:.06em;color:var(--text);overflow:hidden;text-align:left;touch-action:none}
.pad::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--pc)}
.pad::after{content:"";position:absolute;inset:0;border-radius:8px;background:radial-gradient(circle at 50% 40%,var(--pc),transparent 75%);opacity:0;pointer-events:none}
.pad.fl::after{animation:padFlash .18s ease-out}
.pad.dn{background:linear-gradient(#30343c,#24272e);box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
.pad .k{position:absolute;right:6px;top:9px;font:500 9px/1 var(--font-num);color:var(--text-faint)}

/* ---------- sheets (§2.3): one frame — header row(s), LCD line, tab row, body without vertical scroll ---------- */
.sheet{display:none;position:relative;z-index:20;flex-direction:column;background:linear-gradient(var(--chassis),#111316);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.55);min-width:0;min-height:0;overflow:hidden}
.sheet.open{display:flex}
.sheet.ed{touch-action:none}
.sh-head{flex:none;display:flex;flex-direction:column;border-bottom:1px solid var(--panel-edge);background:linear-gradient(#1d2026,#16181d)}
.sh-row{display:flex;align-items:center;gap:6px;min-width:0;padding:0 8px}
.sh-head .r1{height:44px}
.sh-head .r2{height:40px;padding-bottom:2px;gap:4px}
.sh-sp{flex:1 1 0;min-width:0}
.sh-title{display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto}
.sh-title .dot{width:10px;height:10px;border-radius:50%;background:var(--tc);box-shadow:0 0 6px var(--tc);flex:none}
.sh-title b{font:700 13px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trchip{flex:0 1 auto;min-width:0;height:26px;padding:0 8px;border-radius:13px;display:inline-flex;align-items:center;font:700 12px/1 var(--font-ui);color:var(--amber);background:rgba(255,178,46,.12);border:1px solid #6b4c16;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.trchip[hidden]{display:none}
.sh-title .stt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-width:0}
.sh-title .stt b{max-width:100%}
.sh-title .stt .trchip{flex:none;height:16px;padding:0 6px;border-radius:8px;font-size:10.5px;letter-spacing:.02em;max-width:none;overflow:visible}
.sh-head .r1 .sh-title:has(.trchip:not([hidden])){flex:none}
@media (orientation:portrait) and (max-width:359px){
  #synthSheet .sh-head .r1:has(.trchip:not([hidden])) .seg.eng button{min-width:28px;padding:0 2px}
  #synthSheet .sh-head .r1:has(.trchip:not([hidden])){gap:2px}
  .sh-title .stt .trchip{padding:0 4px;letter-spacing:0}
}
.sh-x{width:44px;height:40px;font-size:16px;flex:none}
.sh-head .seg{flex-wrap:nowrap;flex:none}
.sh-head .seg button{height:34px;min-width:40px}
.hb.ur{width:40px;min-width:40px;padding:0;font-size:18px}
.hb.ur:disabled{opacity:.3}
.sh-bar{flex:none;display:flex;flex-wrap:wrap;border-bottom:1px solid var(--panel-edge)}
.lcd{order:-1;flex:1 1 100%;height:28px;margin:4px 8px 0;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:5px;background:var(--lcd);box-shadow:inset 0 1px 5px rgba(0,0,0,.9);font:500 12px/1 var(--font-num);color:var(--text);white-space:nowrap;overflow:hidden;min-width:0}
.lcd .lk{flex:none;font:700 11px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--tc,var(--text-dim))}
.lcd .lv{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lcd .lx{flex:none;margin-left:auto;font:700 10px/1 var(--font-ui);color:var(--ink);background:var(--sel);padding:2px 4px;border-radius:3px}
.sh-tabs{flex:1 1 100%;display:flex;gap:3px;padding:5px 8px 0;min-width:0;height:40px}
.tab{flex:1 1 0;min-width:0;height:35px;padding:0 6px;border-radius:6px 6px 0 0;font:700 12px/1 var(--font-ui);letter-spacing:.08em;color:var(--text-dim);background:var(--chassis);border:1px solid var(--line);border-bottom:0;white-space:nowrap;overflow:hidden}
.tab.on{color:var(--text);background:var(--chassis-3);box-shadow:inset 0 2px 0 var(--tc)}
.sh-body{flex:1 1 auto;min-height:0;overflow:hidden;padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px;touch-action:none}
.preset{display:flex;align-items:center;gap:2px;min-width:0}
.preset .pv{height:40px;min-width:72px;max-width:150px;padding:0 8px;font:700 13px/1 var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset .pa{width:34px;height:40px;font-size:18px}
.hb{height:40px;padding:0 10px;font:700 12px/1 var(--font-ui);letter-spacing:.05em;white-space:nowrap}
.hb.big{min-width:44px;font-size:17px}
.hb.hold.on{color:var(--play);border-color:var(--play-dim)}
.grp{display:flex;flex-direction:column;gap:5px;min-width:0}
.grp>.lbl{padding-left:2px}
.brk{flex-basis:100%;height:0}
/* pages: knob rows of up to 4 (P) / one row (L), segments on their own row (§2.4) */
.pg{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.pgrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.lgrp{display:flex;align-items:center;gap:8px;min-width:0}
.lgrp>.lbl{flex:none;min-width:46px}
.segcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.kn-row{display:grid;grid-template-columns:repeat(4,72px);gap:2px 16px;justify-content:start;align-content:start}
.pg .note{max-width:560px}
.pg-filter .xy{flex:1 1 auto;min-height:84px;height:auto;width:100%;max-width:none}
.pg-env .adsr{flex:none;width:100%;max-width:none;height:78px}
.pg-fx{display:grid;grid-template-columns:56px max-content;grid-template-areas:"f k" "s s";gap:8px 14px;align-content:start}
.pg-fx .fxf{grid-area:f}
.pg-fx .kn-row{grid-area:k;grid-template-columns:repeat(3,72px);gap:2px 12px}
.pg-fx .segcol{grid-area:s}
.pg-dfx .kn-row{grid-template-columns:repeat(3,72px)}
.pg-dsound,.pg-dsteps{gap:8px}
.pg-dsteps .foot{flex-wrap:nowrap;align-items:flex-start;gap:12px}
.pg-dsteps .ovw{flex:none}
/* bar pager next to the overview: segment where it fits on one row, else ‹ Takt k/n › (+ grid popover) */
.pgside{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px;container-type:inline-size}
.pginfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pgnav{display:flex;min-width:0}
.pgseg{display:none;align-items:center;gap:8px;min-width:0}
.pgseg .seg{flex-wrap:nowrap}
.pgseg .seg button{min-width:40px;padding:0 6px}
.pgstep{display:flex;align-items:center;gap:3px;min-width:0}
.pgstep .pa{flex:none;width:42px;height:40px;padding:0;font-size:18px}
.pgstep .pv{flex:0 1 auto;min-width:78px;height:40px;padding:0 8px;font:700 13px/1 var(--font-ui);white-space:nowrap;overflow:hidden}
.pgstep .pv small{font-size:11px;color:var(--text-dim);margin-left:1px}
.pgstep .pa:disabled{opacity:.3}
@container (min-width:150px){.pgnav.n2 .pgseg{display:flex}.pgnav.n2 .pgstep{display:none}}
@container (min-width:240px){.pgnav.n4 .pgseg{display:flex}.pgnav.n4 .pgstep{display:none}}
@container (min-width:420px){.pgnav.n8 .pgseg{display:flex}.pgnav.n8 .pgstep{display:none}}
@container (min-width:760px){.pgnav.n16 .pgseg{display:flex}.pgnav.n16 .pgstep{display:none}}
.plist.bars{grid-template-columns:repeat(4,52px)}
.plist.bars button.on{border-color:var(--sel);color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
/* segments: LED dot on the active one */
.seg{display:inline-flex;flex-wrap:wrap;border-radius:6px;background:#0b0c0e;border:1px solid var(--panel-edge);padding:2px;gap:2px;max-width:100%}
.seg button{position:relative;min-width:44px;height:40px;padding:0 9px;border-radius:4px;font:700 12px/1 var(--font-ui);letter-spacing:.04em;color:var(--text-dim);white-space:nowrap}
.seg button.on{background:linear-gradient(var(--chassis-3),var(--chassis-2));color:var(--text);box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--tc,var(--sel))}
.seg button.on::after{content:"";position:absolute;top:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--tc,var(--sel));box-shadow:0 0 4px var(--tc,var(--sel))}
.seg.wv button{font-size:18px;min-width:44px;padding:0 6px}
.seg.pages button{height:36px;min-width:52px}
/* ---------- controls v2 (§10.1): knob 72×92 with SVG 60, fader 56×170, press/arm/detent feedback in the same frame ---------- */
.knob{width:72px;height:92px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;touch-action:none;position:relative;outline:none;cursor:ns-resize;border-radius:8px}
.knob .kl,.fader .kl{font:600 11px/13px var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis}
.knob svg{width:60px;height:60px;overflow:visible;transition:transform .08s}
.knob .kt{fill:none;stroke:#2a2e36;stroke-width:4;stroke-linecap:round}
.knob .kv{fill:none;stroke:var(--tc,var(--sel));stroke-width:4;stroke-linecap:round}
.knob .kc{fill:#2a2e36;stroke:#0a0b0d;stroke-width:1.5}
.knob .kc2{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1}
.knob .kp{stroke:var(--text);stroke-width:2.5;stroke-linecap:round}
.knob .kpr{fill:none;stroke:var(--sel);stroke-width:2;stroke-linecap:round;opacity:0;stroke-dashoffset:var(--lpl)}
.knob .tk{stroke:#3a3f49;stroke-width:1.6;stroke-linecap:round}
.knob .tk.on{stroke:var(--tc,var(--sel));stroke-width:2.4}
.knob .kn,.fader .kn{font:500 12px/14px var(--font-num);color:var(--text);white-space:nowrap;letter-spacing:-.02em}
.knob.press svg{transform:scale(.95)}
.knob.press .kc{fill:#20232a}
.knob.drag .kv{stroke-width:5}
.knob.press:not(.drag):not(.armed) .kpr{animation:lp .3s linear .15s forwards}
@keyframes lp{from{opacity:.9;stroke-dashoffset:var(--lpl)}to{opacity:.9;stroke-dashoffset:0}}
.knob.armed .kpr{opacity:.9;stroke-dashoffset:0}
.knob.armed svg{transform:scale(1.08)}
.knob.detent svg,.fader.detent .fcap{animation:det .14s}
@keyframes det{50%{transform:scale(1.07)}}
.knob .fine,.fader .fine{position:absolute;top:13px;right:-8px;font:700 8.5px/1 var(--font-ui);color:var(--ink);background:var(--sel);padding:2px 3px;border-radius:3px;display:none;white-space:nowrap;z-index:2;pointer-events:none}
.knob.fineon .fine,.fader.fineon .fine{display:block}
.knob:focus-visible,.fader:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.fader{width:56px;height:170px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;position:relative;outline:none;cursor:ns-resize;--n:0}
.fader .ftrack{position:relative;flex:1 1 auto;width:40px;min-height:0;border-radius:6px;background:var(--lcd);box-shadow:inset 0 1px 5px rgba(0,0,0,.9);border:1px solid var(--panel-edge)}
.fader .ffill{position:absolute;left:50%;bottom:8px;width:4px;margin-left:-2px;height:calc(var(--n) * (100% - 16px));background:var(--tc,var(--sel));border-radius:2px}
.fader .fmid{display:none}
.fader .fcap{position:absolute;left:2px;right:2px;height:16px;top:calc((1 - var(--n)) * (100% - 16px));border-radius:4px;background:linear-gradient(#3d424d,#262a33);border:1px solid #000;box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)}
.fader .fcap::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:2px;border-radius:1px;background:var(--tc,var(--sel))}
.fader.press .fcap{background:linear-gradient(#2c3038,#1d2026)}
/* long-press progress (§9.3, §10.6), the faders' twin of the knob ring: two bars along the track fill from 150 to 450 ms */
.fader .fpr{position:absolute;left:-5px;right:-5px;top:0;bottom:0;pointer-events:none;opacity:0;transform:scaleY(0);transform-origin:50% 100%;
  background:linear-gradient(var(--sel),var(--sel)) left/2px 100% no-repeat,linear-gradient(var(--sel),var(--sel)) right/2px 100% no-repeat;border-radius:2px}
.fader.press:not(.drag):not(.armed) .fpr{animation:flp .3s linear .15s forwards}
@keyframes flp{from{opacity:.9;transform:scaleY(0)}to{opacity:.9;transform:scaleY(1)}}
.fader.armed .fpr{opacity:.9;transform:none}
.fader.drag .ffill{width:6px;margin-left:-3px}
#bub{position:fixed;left:0;top:0;z-index:80;display:none;transform:translate(-50%,-100%);pointer-events:none;background:var(--sel);color:var(--ink);font:700 13px/1 var(--font-num);padding:5px 7px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6)}
#bub.on{display:block}
#bub.side{transform:translate(0,-50%)}
#bub.side.left{transform:translate(-100%,-50%)}
#bub.mod{background:var(--msrc);color:var(--ink)}
/* picker (long-press): marking menu above the control */
.pop.pk{min-width:0;padding:6px;border-radius:12px;background:#1d2027;border-color:#000}
.pkrow{display:flex;gap:6px}
.pchip{min-width:160px;height:52px;padding:0 12px;border-radius:9px;background:var(--chassis-3);border:1px solid #000;font:700 13px/1.1 var(--font-ui);letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text);transition:transform .06s,background-color .06s}
.pchip small{font:600 10px/1 var(--font-num);color:var(--text-dim)}
.pchip.hot{background:var(--sel);color:var(--ink);transform:scale(1.04)}
.pchip.hot small{color:var(--ink)}
.pkhint{font:600 11px/1.25 var(--font-ui);color:var(--text-faint);text-align:center;margin-top:6px;letter-spacing:.03em;max-width:240px}
/* ---------- WP5 (§9.3): modulation rings, live dots, source dots, picker with sources, mod mode + banner ---------- */
:root{--m-lfo1:#b9f227;--m-lfo2:#ff8a3d;--m-menv:#ffe14d;--m-vel:#f4f1ea;--m-fenv:#d8c49a;--m-key:#c9a7ff;--m-rnd:#8fd3c7;--m-mw:#aab4c3;--m-aenv:#d1d5db;--msrc:var(--m-lfo1)}
.knob .kmr{fill:none;stroke:var(--mc,var(--msrc));stroke-width:2.5;stroke-linecap:round;opacity:.95}
.knob .kmx{fill:none;stroke:var(--mc,var(--msrc));stroke-width:2.5;stroke-linecap:butt;opacity:.35}
.knob.mna .kmr{opacity:.45}
.knob .kmg{fill:none;stroke:var(--msrc);stroke-width:1.2;stroke-dasharray:2 3;opacity:0}
.knob .kdg{opacity:0}
.knob.has-mod:not(.mna) .kdg{opacity:1}
.knob .kd{fill:#fff;stroke:#000;stroke-width:.8}
.knob .kdh{fill:var(--mc,var(--msrc));opacity:.35}
.knob .kb,.fader .kb{position:absolute;left:0;right:0;bottom:0;height:5px;display:flex;justify-content:center;gap:3px;pointer-events:none}
.knob .kb i,.fader .kb i{flex:none;width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.fader .kb{bottom:-1px}
.fader .fmr,.fader .fmx{position:absolute;right:2px;width:3px;border-radius:2px;background:var(--mc,var(--msrc));display:none;pointer-events:none;bottom:calc(8px + var(--m0,0) * (100% - 16px));height:calc((var(--m1,0) - var(--m0,0)) * (100% - 16px))}
.fader .fmx{opacity:.35;bottom:calc(8px + var(--x0,0) * (100% - 16px));height:calc((var(--x1,0) - var(--x0,0)) * (100% - 16px))}
.fader.has-mod .fmr,.fader.has-mod .fmx{display:block}
.fader.mna .fmr{opacity:.45}
.fader .fdot{position:absolute;left:50%;bottom:3.5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;border:1px solid #000;box-shadow:0 0 0 3px rgba(185,242,39,.3);box-shadow:0 0 0 3px color-mix(in srgb,var(--mc,var(--msrc)) 40%,transparent);display:none;pointer-events:none;will-change:transform;z-index:1}
.fader.has-mod:not(.mna) .fdot{display:block}
/* mod mode: modulatable controls get a dashed ring in the source colour; everything else on the page rests (.3, inert) */
body[data-mod] #synthSheet .knob.modable .kmg{opacity:.9}
body[data-mod] #synthSheet .knob.modable .kv{opacity:.45}
body[data-mod] #synthSheet .fader.modable .ftrack{outline:1px dashed var(--msrc);outline-offset:1px}
body[data-mod] #synthSheet :is(.knob,.fader).mfocus{background:rgba(185,242,39,.12);background:color-mix(in srgb,var(--msrc) 14%,transparent)}
body[data-mod] #synthSheet .sh-body .pg:not(.pg-mod) :is(.knob,.fader,.seg,.tgl,.xy,.enved,.rchip,.bush,.qcell):not(.modable){opacity:.3;pointer-events:none}
body[data-mod] #synthSheet .sh-body .pg:not(.pg-mod) .qcell .seg{opacity:1}
.mbn{position:absolute;z-index:7;display:flex;align-items:center;gap:8px;padding:0 3px 0 9px;border-radius:6px;background:#26300f;background:color-mix(in srgb,var(--msrc) 20%,#0b0c0e);border:1px solid var(--msrc);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.mbn[hidden]{display:none}
.mbn.cmp{gap:6px;padding-left:7px}
.mbn.cmp .mbt small{display:none}
.mbn.cmp .mbf{min-width:46px;padding:0 7px;font-size:11.5px;letter-spacing:.02em}
/* L: the tab row gets compact in mod mode, so the banner fits next to every tab and sub-tab (§9.3) */
@media (orientation:landscape){
  body[data-mod] #synthSheet .sh-bar .tab{padding:0 5px;letter-spacing:.02em}
  body[data-mod] #synthSheet .sh-bar .stab{padding:0 4px;letter-spacing:.01em}
}
@media (orientation:landscape) and (max-width:759px){
  body[data-mod] #synthSheet .sh-bar .tab{padding:0 4px;letter-spacing:0}
  body[data-mod] #synthSheet .sh-bar .stab{padding:0 3px;letter-spacing:0}
}
.mbn .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--msrc);box-shadow:0 0 8px var(--msrc)}
.mbn .mbt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;white-space:nowrap}
.mbn .mbt b{font:700 12px/1.15 var(--font-ui);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis}
.mbn .mbt small{font:600 10px/1.15 var(--font-num);color:var(--text-dim);overflow:hidden;text-overflow:ellipsis}
.mbn .mbf{flex:none;align-self:stretch;margin:3px 0;min-width:64px;padding:0 12px;border-radius:5px;background:var(--msrc);color:var(--ink);font:700 12px/1 var(--font-ui);letter-spacing:.05em;border:0}
.lcd .lm{flex:none;color:var(--mc,var(--msrc));font:500 12px/1 var(--font-num);white-space:nowrap}
/* picker with sources: row 1 = 4 big chips (52), row 2 = the others + ↺ Std. + ✕ n (36); L: one row */
.pkrow + .pkrow{margin-top:6px}
.pchip.src,.pchip.sm{min-width:0}
.pchip.src{flex:1 1 0;min-width:64px;height:52px;padding:0 6px;font-size:12px}
.pchip.src i{width:22px;height:4px;border-radius:2px;background:var(--c);flex:none}
.pchip.src.hot{background:var(--c);color:var(--ink)}
.pchip.src.hot i{background:var(--ink)}
.pchip.sm{flex:1 1 auto;height:36px;padding:0 5px;font-size:11px;color:var(--text-dim);gap:2px;white-space:nowrap}
.pk.srcs .pkrow + .pkrow{gap:4px}
.pchip.sm.src{min-width:0;height:36px}
.pchip.sm.src i{width:16px;height:3px}
.pchip.sm.hot{color:var(--ink)}
.pk.srcs{width:min(360px,calc(100vw - 16px))}
.pk.srcs .pkhint{max-width:none}
.pk.one{width:auto;max-width:calc(100vw - 16px)}
.pk.one .pkrow{flex-wrap:nowrap}
.pk.one .pchip.src,.pk.one .pchip.sm{height:52px;min-width:56px;flex:1 0 auto;padding:0 7px}
@media (max-width:759px){.pk.one .pkrow{gap:3px}.pk.one .pchip.src,.pk.one .pchip.sm{min-width:0;padding:0 4px;font-size:11px;letter-spacing:.01em}}
@media (orientation:portrait) and (max-width:359px){.pchip.sm{font-size:10px;letter-spacing:0;padding:0 3px}.pchip.src{min-width:58px;padding:0 4px;font-size:11px;letter-spacing:.01em}}
.pchip.src>span{white-space:nowrap}
/* MOD tab (§9.3): source strip with live meters; rows with a live source meter */
.msrcs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;min-width:0}
.schip{min-width:0;height:44px;padding:0 4px;border-radius:8px;background:var(--chassis-2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font:700 11px/1.1 var(--font-ui);letter-spacing:.03em;color:var(--text);touch-action:manipulation;white-space:nowrap}
.schip .sl,.schip .ss{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.schip .ss,.madd .ss{display:none}
@media (orientation:portrait) and (max-height:700px){.schip{height:38px;gap:4px}}
@media (orientation:portrait) and (max-height:600px){.schip{height:34px;gap:3px;font-size:10.5px;letter-spacing:.01em}}
.schip .mt{position:relative;width:76%;height:4px;background:#0b0c0e;border-radius:2px;overflow:hidden;flex:none}
.schip .mt::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--text-faint)}
.schip .mt b{position:absolute;left:50%;top:0;bottom:0;width:50%;background:var(--c);transform-origin:0 50%;transform:scaleX(0)}
.schip.on{background:#2a3214;background:color-mix(in srgb,var(--c) 22%,var(--chassis-2));border-color:var(--c)}
.pg-mod .modrow .ms i{transform-origin:50% 50%;will-change:transform}
.pg-mod .mtop{flex:none;display:flex;flex-direction:column;gap:6px;min-width:0}
@media (orientation:landscape){
  .pg-mod .mtop{flex-direction:row;align-items:center}
  .pg-mod .mtop .msrcs{flex:1 1 auto;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
  .schip{height:36px;gap:4px;padding:0 3px}
  .schip .mt{width:70%;height:3px}
  .pg-mod .modhead{flex:none}
  .pg-mod .modhead .madd{height:34px;padding:0 10px}
  .pg-mod .modrow{min-height:34px;padding:2px 3px 2px 5px}
  .pg-mod .modrow .ms{height:30px;flex-direction:row;gap:5px}
  .pg-mod .modrow .ms i{width:4px;height:16px}
  .pg-mod .modrow .md{flex-direction:row;align-items:baseline;gap:8px}
  .pg-mod .bsl{height:28px}
  .pg-mod .bsl b{top:9px;bottom:9px}
  .pg-mod .modrow .mx{height:30px}
  .pg-mod .mxlist{gap:3px}
  /* §9.3 L: the matrix shows 3 rows at a time; --mrh = a third of the list height (modRowFit), 24…34 px */
  .pg-mod{gap:4px}
  .pg-mod .modrow{min-height:0;height:var(--mrh,34px);padding-top:1px;padding-bottom:1px}
  .pg-mod .modrow .ms,.pg-mod .modrow .mx{height:calc(var(--mrh,34px) - 4px)}
  .pg-mod .modrow .bsl{height:calc(var(--mrh,34px) - 6px)}
  .pg-mod .modrow .bsl b{top:calc(var(--mrh,34px) / 2 - 8px);bottom:calc(var(--mrh,34px) / 2 - 8px)}
}
@media (orientation:landscape) and (max-width:759px){.schip .sl,.madd .sl{display:none}.schip .ss,.madd .ss{display:inline}}
/* „Was ist anders?“ (§5.2 P1): a white dot on every control that differs from the base patch; tab counts */
.fader.diff::before,.seg.diff::before,.tgl.diff::before{content:"";position:absolute;top:1px;right:3px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000,0 0 5px rgba(255,255,255,.6);pointer-events:none;z-index:2}
.knob .kdf{fill:#fff;stroke:#000;stroke-width:.6;opacity:0}
.knob.diff .kdf{opacity:1}
.seg.diff,.tgl.diff{position:relative}
.tab{position:relative}
.tab .dn{position:absolute;top:2px;right:3px;font:700 9px/1 var(--font-num);letter-spacing:0;color:var(--sel)}
.hb.wia{min-width:36px;width:36px;padding:0;font-size:17px}
.hb.wia.on{background:var(--sel);color:var(--ink);border-color:var(--sel)}
#synthSheet .sh-bar{position:relative}
#synthSheet .lcd{padding-right:44px}

.lcd.wia{white-space:normal}
.lcd.wia .lv{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font:500 10.5px/1.18 var(--font-ui);letter-spacing:.01em;overflow:hidden;padding-bottom:0;margin-bottom:0}
.adsr{width:100%;max-width:420px;height:78px;background:var(--lcd);border:1px solid var(--panel-edge);border-radius:var(--r-s);box-shadow:inset 0 1px 6px rgba(0,0,0,.8)}
.adsr svg{width:100%;height:100%}
.adsr .ln{fill:none;stroke:var(--text-faint);stroke-width:2;stroke-linejoin:round}
.adsr .hl{fill:none;stroke:var(--tc);stroke-width:2.5;stroke-linejoin:round}
.adsr .ar{fill:var(--tc);opacity:.08}
.xy{position:relative;width:100%;max-width:420px;height:140px;background:var(--lcd);border:1px solid var(--panel-edge);border-radius:var(--r-s);box-shadow:inset 0 1px 6px rgba(0,0,0,.8);touch-action:none;overflow:hidden}
.xy .gx,.xy .gy{position:absolute;background:var(--tc);opacity:.55;pointer-events:none}
.xy .gx{top:0;bottom:0;width:1px}
.xy .gy{left:0;right:0;height:1px}
.xy .pt{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--tc);background:rgba(0,0,0,.4);pointer-events:none;box-shadow:0 0 10px var(--tc)}
.xy .xv{position:absolute;right:6px;bottom:5px;font:500 10px/1.3 var(--font-num);color:var(--text-dim);text-align:right;pointer-events:none}
.xy .xl{position:absolute;left:6px;top:5px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:36px;min-width:40px;padding:0 9px;font:700 12px/1 var(--font-ui);letter-spacing:.04em;color:var(--text-dim);white-space:nowrap}
.chip.on{color:var(--text);border-color:var(--tc,var(--sel));box-shadow:inset 0 2px 4px var(--shadow),inset 0 -2px 0 var(--tc,var(--sel))}
.vchip{position:relative;overflow:hidden}
.vchip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc)}
.vchips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.vchips .chip{height:40px;min-width:0;padding:0 4px 0 7px;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;width:100%;touch-action:none}
@media (orientation:portrait){.steps{grid-template-columns:repeat(8,minmax(0,1fr))}}
.stepb{height:44px;min-width:0;border-radius:5px;background:linear-gradient(#22252b,#1a1c21);border:1px solid #000;box-shadow:inset 0 1px 0 var(--hi);position:relative;touch-action:none}
.stepb.q4{background:linear-gradient(#2a2d34,#20232a)}
.stepb.on{background:linear-gradient(var(--pc),rgba(0,0,0,.25));opacity:.75}
.stepb.acc{background:var(--pc);opacity:1;box-shadow:0 0 10px var(--pc)}
.stepb.ph{outline:2px solid var(--sel);outline-offset:-2px}
.stepb.fl{animation:stepFl .2s ease-out}
@keyframes stepFl{0%{box-shadow:0 0 0 3px var(--sel)}100%{box-shadow:0 0 0 0 transparent}}
.stepb .sn{position:absolute;left:3px;top:3px;font:500 8px/1 var(--font-num);color:var(--text-faint)}
.ovw{display:grid;grid-template-columns:repeat(16,6px);grid-auto-rows:6px;gap:3px 4px;padding:6px;background:var(--lcd);border:1px solid var(--panel-edge);border-radius:var(--r-s)}
.ovw i{width:6px;height:6px;border-radius:50%;background:#20232a;display:block}
.ovw i.on{background:var(--pc)}
.ovw i.ph{box-shadow:0 0 0 1px var(--sel)}
.ovw .row{display:contents}
.small{font-size:11px;color:var(--text-dim);line-height:1.3}

/* clip sheet */
#clipSheet{display:none;z-index:22;align-self:end;max-height:100%;border-radius:12px 12px 0 0}
#clipSheet.open{display:flex}
#clipSheet .sh-head{padding:6px 0}
#clipSheet .sh-body{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex-direction:row;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:12px;padding:10px 8px 12px}
.delb{position:relative;overflow:hidden;min-width:150px}
.delb.arm{background:var(--rec);color:#fff;border-color:var(--rec)}
.delb .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#fff;transform-origin:0 50%;display:none}
.delb.arm .bar{display:block}
.delb.arm .bar{animation:shrink 3s linear forwards}
/* clip sheet (v1 layout until WP2): ✕ on the right, compact ↶ ↷; the action row wraps rather than hide [Schließen] */
#clipSheet .sh-title{flex:1 1 auto}
#clipSheet .csub{display:block;margin-top:3px;font:600 11px/1.15 var(--font-ui);letter-spacing:.02em;text-transform:none;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis}
#clipSheet .csub .dash{display:none}
#clipSheet .sh-body{gap:8px}
#clipSheet .sh-body>.sh-row{padding:0;flex-wrap:wrap;gap:8px 6px}
#clipSheet .sh-body .hb.ur{width:48px;min-width:48px}
@media (max-width:389px){
  #clipSheet .sh-body>.sh-row .hb{font-size:11px;letter-spacing:.02em}
  #clipSheet .delb{min-width:128px}
  #clipSheet .sh-body .hb.ur{width:44px;min-width:44px;font-size:18px}
}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:100vw;overflow:hidden}
#menu.open{display:flex}
#menu .mh{flex:none;display:flex;align-items:center;gap:12px;padding:6px 10px;border-bottom:1px solid var(--panel-edge);background:linear-gradient(#1b1d22,#121418)}
.mlogo{flex:none;display:flex;align-items:center;pointer-events:none}
.mlogo svg{height:64px}
.mtitle{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.mtitle b{font:700 18px/1 var(--font-ui);letter-spacing:.16em;white-space:nowrap}
.mtitle small{font:500 12px/1.2 var(--font-ui);color:var(--text-dim)}
#menu .mb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 12px 24px;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.mcol{display:contents}
@media (orientation:landscape){
  #menu .mb{flex-direction:row;align-items:flex-start;gap:24px}
  .mcol{display:flex;flex-direction:column;flex:1 1 0;min-width:0}
  .mlogo svg{height:48px}
}
.msec{width:100%;max-width:720px;margin:0 auto;padding:12px 0;border-bottom:1px solid var(--line)}
.mstatus{font:600 13px/1.4 var(--font-ui);color:var(--text);margin:2px 0 6px}
.mstatus.warn{color:var(--amber)}
.mlist{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.prow{display:flex;align-items:stretch;gap:4px;min-height:48px}
.pmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:0 12px;text-align:left;border-radius:var(--r-s);background:var(--chassis-2);border:1px solid var(--line)}
.pmain b{font:700 14px/1.1 var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pmain span{font-size:11px;color:var(--text-dim)}
.prow.open .pmain{border-color:var(--play-dim)}
.prow.open .pmain span{color:var(--play)}
.pmore{width:48px;flex:none;font-size:18px}
.pacts{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.pacts[hidden]{display:none}
.hrow{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;width:100%;min-height:48px;padding:0 12px;text-align:left}
.hrow b{font:700 14px/1 var(--font-ui)}
.hrow span{font-size:11px;color:var(--text-dim)}
.hrow.arm{background:var(--rec);border-color:var(--rec);color:#fff}
.minfo{display:flex;flex-direction:column;gap:6px}
.irow{display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.3}
.irow .lbl{flex:none;min-width:150px}
@media (orientation:landscape){.prow,.hrow{min-height:44px}}
.msec h3{margin:0 0 10px;font:700 12px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.mrow>.lbl{min-width:110px}
.mbtn{height:44px;padding:0 14px;font:700 13px/1 var(--font-ui);letter-spacing:.04em}
.mbtn.arm{background:var(--rec);border-color:var(--rec);color:#fff}
.mbtn.go{color:var(--play);border-color:var(--play-dim)}
.tin{height:44px;min-width:0;flex:1 1 180px;max-width:320px;padding:0 10px;background:var(--lcd);border:1px solid var(--line);border-radius:var(--r-s)}
.rng{flex:1 1 160px;max-width:320px;accent-color:var(--sel);height:32px}

/* ---------- popovers, toast, banner ---------- */
#popLayer{position:fixed;inset:0;z-index:60;display:none}
#popLayer.open{display:block}
#popLayer .bd{position:absolute;inset:0;background:var(--backdrop)}
.pop{position:absolute;min-width:200px;max-width:calc(100vw - 16px);max-height:calc(100% - 16px);overflow-y:auto;background:linear-gradient(var(--chassis-2),var(--chassis));border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.7);padding:12px}
.pop h4{margin:0 0 10px;font:700 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.bpmbig{font:700 54px/1 var(--font-num);text-align:center;margin:4px 0 10px}
.bpmrow{display:flex;align-items:center;gap:8px}
.bpmrow .rng{flex:1}
.tapb{width:100%;height:64px;margin-top:10px;font:700 18px/1 var(--font-ui);letter-spacing:.2em}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:0 0 6px;border-radius:8px;min-height:56px}
.opt b{display:block;font:700 15px/1.1 var(--font-ui);letter-spacing:.06em;margin-bottom:4px}
.opt span{display:block;font-size:12px;line-height:1.3;color:var(--text-dim)}
.opt.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.opt.on b{color:var(--amber)}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.plist button{height:44px;font:700 13px/1 var(--font-ui)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:9px 12px;border-radius:8px;background:rgba(244,241,234,.96);color:var(--ink);font:600 13px/1.25 var(--font-ui);box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none}
#toast.show{display:flex}
#toast button{pointer-events:auto;height:34px;padding:0 10px;border-radius:5px;background:var(--ink);color:var(--sel);font:700 12px/1 var(--font-ui);letter-spacing:.04em;flex:none;touch-action:manipulation}
#toast .tmsg{min-width:0}
#toast.band{position:relative;left:auto;top:auto;transform:none;z-index:auto;flex:none;justify-content:space-between;max-width:none;min-height:44px;margin:0 8px 6px;padding:5px 6px 5px 12px;box-shadow:0 2px 10px rgba(0,0,0,.45);pointer-events:auto}
#toast.dock .tmsg{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the band never cuts its message („2 Takte · 14 Noten · a-Moll · 1/8“, §3.1 Result): the text wraps onto a 2nd line
   beside the buttons (--tmb and the classes tcomp / t3 are set by toastFit); a toast whose buttons have no symbol
   puts them on their own row, right-aligned, where its text does not fit */
#toast.band{flex-wrap:wrap;row-gap:4px}
#toast.band .tmsg{flex:1 1 var(--tmb,auto);overflow-wrap:break-word;white-space:normal}
#toast .tacts{display:flex;align-items:center;align-self:stretch;gap:inherit;row-gap:0;flex:none}
#toast.band .tacts{margin-left:auto}
#toast.band .tp{white-space:nowrap}
#toast.band.tpw .tp{white-space:normal}
#toast.tcomp .tacts{gap:6px}
#toast.tcomp .tacts button[data-ic]{width:44px;padding:0;font-size:18px;letter-spacing:0}
#toast.tcomp .tacts button[data-ic] .bl{display:none}
#toast.tcomp .tacts button[data-ic]::before{content:attr(data-ic)}
#toast.dock.lcdk.tcomp .tacts button[data-ic]{font-size:15px}
#toast.dock .tp{white-space:nowrap}
#toast.dock.dk2 .tmsg,#toast.dock.dk3 .tmsg{white-space:normal;text-overflow:clip;align-self:center}
#toast.dock.dk2 .tmsg{font-size:12px;line-height:1.15;max-height:28px}
#toast.dock.dk3 .tmsg{font-size:11px;line-height:1.1;max-height:37px}
#toast.band.t3 .tmsg{font-size:12px;line-height:1.15}
#toast.dock{transform:none;max-width:none;background:#f4f1ea;justify-content:space-between;gap:6px;padding:0 4px 0 10px;pointer-events:auto}
#toast.dock.lcdk{border-radius:5px;padding:0 2px 0 10px;font-size:12px}
#toast.dock.lcdk button{height:calc(100% - 4px);min-height:22px}
#menu>#toast.band,#clipSheet>#toast.band{margin:6px 10px 8px}
#gridArea.toasting #hint{display:none}                 /* the action band takes the hint's place for 5 s: the clip rows keep their size */
#banner{position:fixed;left:0;right:0;top:0;z-index:65;display:none;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--rec);color:#fff;text-align:center;font:700 14px/1.2 var(--font-ui)}
#banner.show{display:block}

/* ===================== WP2: recording, stop, clip editor, steps, quantize, FANG, keys (spec v2 §3, §4) ===================== */
/* REC button: armed blinks once per beat, recording pulses 80 ms per beat (classes flipped in uiFrame), overdub sub-label OD */
#bRec.armed{animation:none;border-color:var(--rec)}
#bRec.armed.ba{animation:recBlinkA calc(var(--spb,.5s) * .9) ease-out}
#bRec.armed:not(.ba){animation:recBlinkB calc(var(--spb,.5s) * .9) ease-out}
@keyframes recBlinkA{0%{background:var(--rec);color:#fff}100%{background:transparent}}
@keyframes recBlinkB{0%{background:var(--rec);color:#fff}100%{background:transparent}}
#bRec.active{background:var(--rec);border-color:var(--rec)}
#bRec.active .dot{color:#fff}
#bRec.active.pulse{animation:recPulseA .08s ease-out}
#bRec.active:not(.pulse){animation:recPulseB .08s ease-out}
@keyframes recPulseA{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes recPulseB{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.takt .lbl.recl{color:var(--rec);font-weight:700}
#countin .ciT{margin-top:2px;color:var(--text-dim);letter-spacing:.08em}
/* slots: ■ on playing clips, queued stop "stopp in N" dim at 4 Hz, big count digit, red fill while recording */
.slot .sq{position:absolute;right:3px;bottom:2px;font-size:10px;line-height:1;color:var(--tc);display:none;pointer-events:none;z-index:3}
.slot.playing .sq{display:block}
.slot.sel .sq{right:6px;bottom:5px}
.slot.playing .tx{right:15px}
.slot.sel.playing .tx{right:18px}
/* the ■ moves the live text („2/3“) left: in a narrow cell it would run into the length label („3T“), so there the
   length label gives way while the live text shows (class lnoff, from the cell width that cellFit measures) */
.slot.lnoff .ln{display:none}
.slot.qstop{animation:qstopBlink .25s steps(2,start) infinite}
@keyframes qstopBlink{50%{opacity:.45}}
.slot.qstop .tx{color:var(--text)}
.slot .big{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:700 20px/1 var(--font-num);color:var(--rec);pointer-events:none;z-index:4;text-shadow:0 0 10px rgba(255,69,56,.5)}
.slot .big.on{display:flex}
.slot .rfill{position:absolute;inset:0;background:var(--rec);opacity:.3;transform-origin:0 50%;transform:scaleX(0);pointer-events:none;will-change:transform}
.slot.rec{background:var(--rec-dim)}
.slot.od::after{border-color:var(--rec)}
.scn{flex-direction:column;gap:1px;line-height:1}
.scn .st{display:flex;align-items:center;gap:6px}
.scn .sk{font:600 9px/1 var(--font-ui);color:var(--text-dim);letter-spacing:.02em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.scn .sk:empty{display:none}
/* strip: ✎ and the 52 px FOLGT icon toggle */
#bEdit{width:44px;min-width:44px;padding:0;font-size:17px}
#bFolgt{width:52px;min-width:52px;padding:0;font-size:14px;letter-spacing:0;gap:1px}
/* below 360 px ⇅ shows only its glyph (no ✓): ⇅ and ✎ get 38 px (× 44 tall) so the selected track's name stays readable
   in the strip — at this width it is the only place that shows it in full („SYNTH 4 / VA · Lead“) */
@media (orientation:portrait) and (max-width:359px){#strip #bFolgt,#strip #bEdit{width:38px;min-width:38px}#strip #bKlang{padding:0 6px}}
#bFolgt .ck{width:auto;font-size:11px}
#bFolgt:not(.on) .ck{font-size:9px;letter-spacing:.04em;text-transform:uppercase}
#stLock{font-size:13px;width:34px;text-align:center}
/* mode bar: fixed 64 px FANG slot at the right end (P); the segment shrinks to fit; nothing appears over the keys */
@media (orientation:portrait){
  #modebar{grid-template-columns:44px minmax(0,1fr) 44px 64px;grid-template-areas:"dn seg up fang";gap:5px}
  #fangSlot{grid-area:fang;min-width:0;display:flex;align-items:center}

#fangSlot{display:none}

#bFang{width:64px;height:40px;visibility:hidden;font:700 11px/1.05 var(--font-ui);letter-spacing:.06em;color:var(--amber);border-color:var(--amber);background:rgba(255,178,46,.08)}
#bFang.lit{visibility:visible;animation:fangIn .2s ease-out}
@keyframes fangIn{from{opacity:0}to{opacity:1}}

#kbRef:empty{display:none}

/* keyboard: pressed keys red while recording; lit keys = degrees of the key (TRANSPONIEREN loud, SPIELEN quiet) */
#kb.rec .key.w.dn{background:#ffb3ad}

.key.tonic .rf{display:block;width:6px;height:6px;margin-left:-3px;bottom:22px;box-shadow:0 0 4px var(--amber)}

/* Aufnahme-Leiste (§3.1): P replaces the carrier bar (same 56 px row, no layout shift); L: 96 px at the top of the side panel */
#reclane{display:none;position:relative;min-width:0;min-height:0;background:var(--chassis);border-top:1px solid var(--panel-edge);overflow:hidden;
  grid-template-columns:minmax(0,1fr) 58px;grid-template-rows:14px minmax(0,1fr);gap:2px 6px;padding:3px 8px 4px}

   are the minimum heights per viewport */

.rchip.wk{color:var(--text-dim);background:repeating-linear-gradient(135deg,#1c1f25 0 5px,#15171b 5px 10px)}
.lfohint{flex:none;font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* MOD tab (§9.3, WP3: list, slider, ✕, [+ Modulation]); the list scrolls on its label column only */
.pg-mod{gap:6px}
.modhead{flex:none;gap:10px;flex-wrap:nowrap}
.madd{height:40px;padding:0 14px;border-style:dashed;font:700 12px/1 var(--font-ui);letter-spacing:.06em;color:var(--text)}
.mxlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:5px;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-right:2px}
.modrow{flex:none;display:grid;grid-template-columns:62px minmax(0,1fr) minmax(96px,1.15fr) 40px;align-items:center;column-gap:7px;min-height:48px;padding:4px 4px 4px 6px;border-radius:8px;background:var(--chassis-2);border:1px solid var(--line)}
.modrow.hl{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.modrow .ms{height:40px;border-radius:6px;background:var(--chassis-3);font:700 11px/1.1 var(--font-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;touch-action:pan-y}
.modrow .ms i{width:24px;height:4px;border-radius:2px;background:var(--c)}
.modrow .md{min-width:0;display:flex;flex-direction:column;gap:2px;touch-action:pan-y}
.modrow .md b{font:700 12px/1.15 var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modrow .md small{font:500 10.5px/1.1 var(--font-num);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modrow .md em{font:700 9px/1 var(--font-ui);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.modrow.wk{background:repeating-linear-gradient(135deg,#1c1f25 0 6px,#17191e 6px 12px)}
.bsl{position:relative;height:36px;touch-action:none;border-radius:6px;background:#0b0c0e;box-shadow:inset 0 1px 4px #000;overflow:hidden}
.bsl::before{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:1px;background:var(--text-faint)}
.bsl b{position:absolute;top:12px;bottom:12px;left:50%;width:0;background:var(--c);border-radius:2px}
.bsl span{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;font:600 11px/1 var(--font-num);color:var(--text);pointer-events:none}
.bsl .lim{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.55);pointer-events:none}
.bsl .lim.l{left:0}.bsl .lim.r{right:0}
.modrow .mx{height:40px;width:40px;font-size:15px;color:var(--text-dim)}
.mempty{color:var(--text-dim);font-size:12.5px;line-height:1.45;padding:12px 6px;text-align:center}
.mcnt{margin-left:auto}
/* [+ Modulation] popover */
.pop .msrc,.pop .mdst{grid-template-columns:repeat(3,minmax(0,1fr))}
.pop .msrc button,.pop .mdst button{min-width:0;white-space:normal;line-height:1.15}
.pop .mdst{grid-template-columns:repeat(2,minmax(0,1fr))}
.pop .mdst button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px}
.pop .mdst button small{margin-top:0}
@media (orientation:portrait) and (max-width:359px){ .pop .msrc button,.pop .mdst button{font-size:12px;padding-left:4px;padding-right:4px} }
@media (orientation:landscape){
  .pop .msrc,.pop .mdst{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pop .mdst button,.pop .msrc button{min-height:36px;height:auto;padding-top:4px;padding-bottom:4px}
  .pop .mgrp{margin-top:4px}
}
.pop .msrc button{position:relative;padding-left:12px}
.pop .msrc button i{position:absolute;left:5px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--c)}
.pop .mdst button.wk{color:var(--text-dim)}
.pop .mdst button small{display:block;font:600 8.5px/1 var(--font-ui);letter-spacing:.06em;color:var(--amber);margin-top:2px}
.pop .mdst button.on{border-color:var(--sel)}
.mgrp{margin-top:6px}
.mgrp .lbl{display:block;margin:0 0 4px 2px}
/* FX page: the bus hint chip */
.chip.bush{height:36px;color:var(--amber);border-color:#6b4c16;background:rgba(255,178,46,.08)}
/* Sichern popover */
.pop .tin{width:100%;max-width:300px;height:44px;margin:4px 0 8px;display:block}
.savrow{display:flex;gap:8px;justify-content:flex-end}
.savrow .mbtn{min-width:96px}
/* ---------- sound browser (§11.2) ---------- */
/* placement: as every .sheet.ed (P: rows 2–4 over grid, strip and carrier; L/W: row 2 only, so the mode bar and the
   keyboard stay playable and a key press can stop a preview, §2.3 / §11.3) */

#sndSheet .br-head .sh-title{flex:none}
#sndSheet .brcur{flex:0 1 auto}

.brbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

.brlist{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 8px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 36px auto;align-items:center;gap:4px;min-height:48px;border-bottom:1px solid #1d2026}
.brow.cur{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--tc,var(--sel));border-radius:7px}
.brow .bpv{width:40px;height:40px;font-size:14px;color:var(--play)}
.brow .bpv.on{color:var(--text);border-color:var(--play-dim)}
.brow .bmain{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;height:48px;justify-content:center;text-align:left;padding:0 4px}
.brow .bmain b{font:700 14px/1.1 var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brow .bmain span{font:500 11px/1.1 var(--font-ui);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brow .beng{font:700 9px/1 var(--font-num);color:var(--text-faint);border:1px solid var(--line);border-radius:3px;padding:3px 4px}
.brow .binfo{width:36px;height:44px;font-size:15px;color:var(--text-dim)}
.brow.open .binfo{color:var(--sel)}
.brow .bmore{width:40px;height:40px;font-size:16px}
.btip{font:500 12.5px/1.4 var(--font-ui);color:var(--text);padding:6px 8px 10px 48px;border-bottom:1px solid #1d2026}
.bacts{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 10px 48px;border-bottom:1px solid #1d2026;align-items:center}
.bacts .tin{flex:1 1 140px;height:40px;min-width:0}
.brfoot{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;border-top:1px solid var(--panel-edge);align-items:center}
.brfoot .mbtn{height:40px}
@media (orientation:portrait){
  .brfoot{flex-wrap:wrap;gap:5px}
  .brfoot>.mbtn{flex:1 1 0;min-width:0;padding:0 6px}
  .brfoot>.bush{flex:1 1 100%;justify-content:center}
}
@media (orientation:portrait) and (max-height:700px){
  .brfoot{padding:4px 8px}
  .brfoot .mbtn{height:36px;font-size:12px}
  .brfoot .chip.bush{height:32px}
  .brcats{padding:4px 8px}
  .brcats .chip{height:32px}
}
.brdl{flex-basis:100%}
.brdl[hidden]{display:none}
@media (orientation:portrait) and (max-height:700px){
  .sh-subs{height:30px;padding-bottom:3px}

  .oscro{line-height:16px}
  .kn-row .knob{height:86px}
  .tgl{height:34px}
}

  .sh-subs{height:28px}

@media (orientation:portrait) and (max-width:389px){ .tab{font-size:11.5px} }
@media (orientation:portrait) and (max-width:359px){
