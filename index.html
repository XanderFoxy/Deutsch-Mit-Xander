/* L/W (§5.2 Header L): one 40 px header row; tabs, sub-tabs and the LCD text share one 32 px row */
@media (orientation:landscape){
  .sh-subs{order:2;flex:0 0 auto;height:32px;padding:4px 0 0 6px;gap:2px}
  .stab{flex:none;height:28px;padding:0 9px;font-size:10.5px;border-radius:6px 6px 0 0;border-bottom:0}
  .lcd{order:3}
  #synthSheet .pg{padding:4px 6px 3px}
  #synthSheet .sh-body{padding:5px 8px 4px}
  .pgrow.segs{gap:6px 10px}
  .seg.wvn .wn{display:none}
  .seg.wvn button{padding:0 8px}
  .seg.foot button{min-width:38px}
  .tgl{height:32px;min-width:52px}
  .oscro{line-height:16px}
  .preset{flex:0 1 auto}
  .preset .pv{max-width:150px}
  /* OSZ: segments + SYNC on one row; knobs + readout below */
  .pg-osc-o1,.pg-osc-o2,.pg-osc-o3{display:grid;grid-template-columns:auto auto minmax(0,1fr);grid-template-rows:auto auto;gap:4px 12px;align-content:start}
  .pg-osc-o1>.pgrow:nth-child(1),.pg-osc-o2>.pgrow:nth-child(1),.pg-osc-o3>.pgrow:nth-child(1){grid-column:1;grid-row:1}
  .pg-osc-o1>.pgrow:nth-child(2),.pg-osc-o2>.pgrow:nth-child(2),.pg-osc-o3>.pgrow:nth-child(2){grid-column:2;grid-row:1}
  .pg-osc-o2>.tgrow{grid-column:3;grid-row:1}
  .pg-osc-o1>.oscro,.pg-osc-o2>.oscro,.pg-osc-o3>.oscro{grid-column:1/-1;grid-row:3;align-self:end}
  .pg-osc-o1>.kn-row,.pg-osc-o2>.kn-row,.pg-osc-o3>.kn-row{grid-column:1/-1;grid-row:2;display:flex;gap:2px 10px}
  .kn-row.k5 .knob{width:72px}
  /* MIX: faders, segments, knobs in one row */
  .pg-osc-mix{flex-direction:row;align-items:stretch;gap:12px}
  .pg-osc-mix .mixtop{flex:0 0 auto}
  .faders .fader{min-height:0}
  .mixk{flex-direction:row;align-items:center}
  .pg-osc-mix .pgrow.segs{flex-direction:column;align-items:flex-start;justify-content:center;flex-wrap:nowrap}
  /* STIMME, FILTER, LFO: segments in the first row, the knobs in one row */
  .pg-osc-voice,.pg-filter-ctl{display:grid;grid-template-columns:repeat(2,max-content) minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:4px 10px;align-content:start}
  .pg-osc-voice>.pgrow.segs,.pg-filter-ctl>.pgrow.segs{grid-column:1/-1;grid-row:1}
  .pg-osc-voice>.kn-row:nth-of-type(2),.pg-filter-ctl>.kn-row:nth-of-type(2){grid-column:1;grid-row:2;display:flex;gap:2px 6px}
  .pg-osc-voice>.kn-row:nth-of-type(3),.pg-filter-ctl>.kn-row:nth-of-type(3){grid-column:2;grid-row:2;display:flex;gap:2px 6px}
  .pg-filter-ctl>.fhint{grid-column:1/-1;grid-row:3}
  .pg-filter-ctl .pgrow.segs{justify-content:flex-start}
  /* HÜLLK.: Form + knobs on the left, the graph on the right */
  .pg-env-amp,.pg-env-flt,.pg-env-mod{display:grid;grid-template-columns:max-content minmax(0,1fr);grid-template-rows:auto 1fr;gap:4px 12px}
  .pg-env .pgrow.segs,.pg-env-amp>.pgrow,.pg-env-flt>.pgrow,.pg-env-mod>.pgrow{grid-column:1;grid-row:1}
  .pg-env-amp>.kn-row,.pg-env-flt>.kn-row,.pg-env-mod>.kn-row{grid-column:1;grid-row:2;display:flex;gap:2px 4px}
  .pg-env-amp>.enved,.pg-env-flt>.enved,.pg-env-mod>.enved{grid-column:2;grid-row:1/3;min-height:0}
  .seg.forms button{padding:0 7px;font-size:11px}
  /* LFO */
  .pg-lfo-l1,.pg-lfo-l2{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;gap:4px 12px;align-content:start}
  .pg-lfo-l1>.pgrow:nth-child(1),.pg-lfo-l2>.pgrow:nth-child(1){grid-column:1/-1;grid-row:1}
  .pg-lfo-l1>.pgrow:nth-child(2),.pg-lfo-l2>.pgrow:nth-child(2){grid-column:1;grid-row:2}
  .pg-lfo-l1>.pgrow:nth-child(3),.pg-lfo-l2>.pgrow:nth-child(3){grid-column:2;grid-row:2;flex-direction:column;align-items:flex-start;flex-wrap:nowrap}
  .pg-lfo-l1>.lfohint,.pg-lfo-l2>.lfohint{grid-column:1/-1;grid-row:3}
  .modrow{min-height:44px;grid-template-columns:72px minmax(0,1fr) minmax(160px,1.4fr) 40px}
  .modrow .ms{height:36px}
  .bsl{height:32px}
  .bsl b{top:10px;bottom:10px}
  .pg-mod{flex-direction:column}
  .modhead .madd{height:32px}
  /* browser: categories in a 120 px column (§11.2 L) */
  .brbody{flex-direction:row}
  .brcats{flex-direction:column;width:120px;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;border-bottom:0;border-right:1px solid var(--panel-edge);padding:4px 6px}
  .brcats .chip{height:32px;width:100%;justify-content:flex-start;padding:0 8px}
  .brcats .cs{display:none}
  .brcats .cl{display:inline}
  .brow{min-height:44px}
  .brow .bmain{flex-direction:row;align-items:center;gap:10px;height:44px}
  .brow .bmain span{flex:1 1 auto}
  .brfoot{padding:4px 8px}
  .brfoot .mbtn{height:34px}
  #sndSheet .br-head .r1{height:40px}
}
@media (orientation:landscape) and (max-width:759px){
  .tab{padding:0 8px}
  .stab{padding:0 6px;letter-spacing:.03em}
  .preset .pv{max-width:110px}
  .hb.sv{padding:0 7px;font-size:11px}

@media (orientation:portrait) and (max-width:359px){
  #synthSheet .sh-head .r1{gap:3px;padding:0 6px}
  #synthSheet .sh-head .seg.eng button{min-width:31px;padding:0 3px;font-size:11px}
  #synthSheet .sh-head .r1 .ur,#synthSheet .sh-head .r1 .sh-x{width:37px;min-width:37px}
  #synthSheet .sh-title{gap:4px}
  .seg.forms button{padding:0 4px;font-size:10.5px;letter-spacing:0}
  .seg.foot button{min-width:38px;font-size:12px}

  .pg-osc-o1 .lgrp>.lbl,.pg-osc-o2 .lgrp>.lbl,.pg-osc-o3 .lgrp>.lbl,.pg-env .lgrp>.lbl,.pg-env-amp .lgrp>.lbl,.pg-env-flt .lgrp>.lbl,.pg-env-mod .lgrp>.lbl{min-width:0}

  .faders .fader .ftrack{width:30px}
  .mixk .knob{width:60px}

  .faders .fader .kl{font-size:9.5px;letter-spacing:0;max-width:100%}
}
@media (orientation:portrait) and (max-height:600px){
  #synthSheet .seg button{height:34px}

  .tgl.tv{height:52px}
  .oscro{line-height:13px}
  .tgrow .small{display:none}
  .qcell .seg button{height:30px}
  .qcell{gap:2px}

  #synthSheet .pg-fx .segcol{gap:4px}
  #synthSheet .pg-osc-o1,#synthSheet .pg-osc-o2,#synthSheet .pg-osc-o3{gap:3px}

}
@media (orientation:portrait) and (max-width:359px){
  #synthSheet .pg:not(.pg-fx) .kn-row:not(.k5){grid-template-columns:repeat(4,minmax(0,72px));justify-content:space-between}
  #synthSheet .pg:not(.pg-fx) .kn-row:not(.k5) .knob{width:auto;min-width:0}
}
@media (orientation:landscape){
  #synthSheet .seg button{height:32px}
  .qcell .seg{flex-direction:column}
  .qcell .seg button{height:30px;min-width:60px}
  .qcell{gap:2px}
  .tgl.tv{height:52px}
}
/* sound browser header + category column: the title is never cut where there is room (L), the long category names fit the 120 px column (L),
   and at < 360 px the „SOUNDS ·“ prefix gives way to the loaded sound's name */
@media (orientation:landscape){
  #sndSheet .br-head .r1 .sh-sp{display:block}     /* the browser header has one row: A/B, Klang, ✕ sit at the right edge as in P */
  #sndSheet .sh-title b{max-width:none}
  .brcats .chip{padding:0 6px;letter-spacing:0}
}
@media (orientation:portrait) and (max-width:359px){ #sndSheet .brpre{display:none} }
/* WT / FM (legacy) engine page: segments, then the knobs in one row (L); the explanation only where there is room */
.pg-osc-eng .note{flex:0 1 auto;min-height:0;overflow:hidden}
@media (orientation:portrait) and (max-height:600px){ .pg-osc-eng .note{display:none} }
@media (orientation:landscape){
  .pg-osc-eng{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:4px 6px}
  .pg-osc-eng>.pgrow{flex:1 1 100%}
  .pg-osc-eng>.kn-row{display:flex;gap:2px 6px;justify-content:flex-start}
  .pg-osc-eng>.note{flex:1 1 160px;max-width:300px;align-self:center;font-size:11px;line-height:1.3;max-height:88px}
}
@media (orientation:landscape) and (max-width:759px){
  .pg-osc-eng>.note{display:none}
}
@media (orientation:landscape) and (max-height:380px){
  #synthSheet .pg-osc-o1,#synthSheet .pg-osc-o2,#synthSheet .pg-osc-o3{row-gap:1px}
}
@media (orientation:landscape) and (max-width:759px){
  #synthSheet .preset .pv{max-width:96px}
  #synthSheet .hb.sv{padding:0 6px}
  #synthSheet .hb.abb{padding:0 5px}
  #synthSheet .sh-head{gap:3px}
  #synthSheet .sh-title b{font-size:12px;letter-spacing:.03em;max-width:none}
  #synthSheet .sh-head .seg.eng button{min-width:34px;padding:0 4px}
  #synthSheet .hb.big,#synthSheet .hb.hold{min-width:38px;width:38px;padding:0}
  #synthSheet .sh-head .ur,#synthSheet .sh-head .sh-x{width:36px;min-width:36px}
  #synthSheet .preset .pa{width:28px}
  .pg-filter-ctl .kn-row .knob,.pg-osc-voice .kn-row .knob{width:66px}
}
@media (orientation:landscape){
  .pg-osc-o1,.pg-osc-o2,.pg-osc-o3{grid-template-columns:auto auto minmax(0,1fr)}
  .pg-osc-o1>.kn-row,.pg-osc-o2>.kn-row,.pg-osc-o3>.kn-row{grid-column:1/3;grid-row:2;justify-content:flex-start}
  .pg-osc-o1>.oscro,.pg-osc-o2>.oscro,.pg-osc-o3>.oscro{grid-column:3;grid-row:2;align-self:center;white-space:normal;line-height:1.35}
  .tgrow .small{display:none}
  .qcell .seg{flex-direction:row}
  .qcell .seg button{height:32px;min-width:52px}
  .pg-filter-ctl>.kn-row:nth-of-type(3){align-items:flex-start}
}
/* ===================== WP4: effect pages SPUR · CHORUS · HALL · ECHO · MASTER (spec v2 §8.3) =====================
   one flat cell list per page: P = rows of 4 knob cells (+ full-width segment rows), L = one knob row + one segment row */
.pg.pg-fxg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:min-content;gap:2px 6px;align-content:start;justify-content:stretch;max-width:420px}
.pg-fxg>.knob{width:auto;min-width:0}
.pg-fxg>.knob .kl{max-width:100%;font-size:10.5px;letter-spacing:.01em}
.pg-fxg>.lgrp.fxrow{grid-column:1/-1;margin-top:4px}
.pg-fxg>.lgrp.fxrow>.lbl{min-width:76px}
.pg-fxg .fxcap{font:600 10px/1.2 var(--font-ui);letter-spacing:.01em;color:var(--text-faint);min-width:0;overflow:hidden}
.pg-fxg .fxcap b{color:var(--amber);font-weight:700;letter-spacing:.08em}
.pg-fxg .fxcap .fxst{color:var(--text-dim)}
.pg-fxg>.bush{grid-column:span 2;align-self:center;justify-self:stretch;height:auto;min-height:40px;white-space:normal;text-align:left;line-height:1.25;padding:4px 10px}
/* chorus: mode row, 3 knobs, the Juno line in the 4th cell */
.pg-fx-chorus>.lgrp.r0{grid-column:1/-1;margin:0 0 4px}
.pg-fx-chorus>.lgrp.r0>.lbl{display:none}
.pg-fx-chorus .seg.chm{flex:1 1 auto;flex-wrap:nowrap}
.pg-fx-chorus .seg.chm button{flex:1 1 0;min-width:0;padding:0 4px}
.pg-fx-chorus>.fxinfo{align-self:center;font:500 11px/1.3 var(--font-num);color:var(--text-dim);min-width:0;grid-column:span 1}
/* hall: 9 knobs, Pumpen, EINFRIEREN, caption + engine status in the 12th cell */
.pg-fx-hall>.frz{align-self:center;justify-self:center}
.pg-fx-hall>.frz.inert{opacity:.35}
.pg-fx-hall>.fxcap{align-self:center}
/* echo: 9 knobs; the 3rd row holds Rückweg and the mode segment with the caption */
.pg-fx-echo>.fxmode{grid-column:2/-1;align-self:center;display:flex;flex-direction:column;gap:5px;min-width:0}
.pg-fx-echo .seg.ecm{flex-wrap:nowrap}
.pg-fx-echo .seg.ecm button{flex:1 1 0;min-width:0;padding:0 4px;font-size:12px;letter-spacing:.02em}
.pg-fx-master>.fxmode{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px;min-width:0}
.pg-fx-master>.fxmode .lgrp>.lbl{min-width:76px}
/* GR meter (bar grows down from 0 dB to −20 dB) + output peak LED */
.grm{display:flex;flex-direction:column;align-items:center;gap:2px;height:92px;min-width:0}
.grm .kl{font:600 11px/13px var(--font-ui);letter-spacing:.03em;color:var(--text-dim)}
.grm .grt{position:relative;width:14px;flex:1 1 auto;min-height:20px;border-radius:3px;background:var(--lcd);box-shadow:inset 0 1px 4px rgba(0,0,0,.9);border:1px solid var(--panel-edge);overflow:hidden}
.grm .grb{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(var(--amber),#c96d10);transform-origin:50% 0;transform:scaleY(0)}
.grm .grv{font:500 11px/13px var(--font-num);color:var(--text);white-space:nowrap}
.grm .pkl{font:700 8px/1 var(--font-ui);letter-spacing:.08em;color:var(--text-faint);padding:2px 4px;border-radius:3px;border:1px solid var(--panel-edge)}
.grm .pkl.on{color:#fff;background:var(--rec);border-color:var(--rec);box-shadow:0 0 6px var(--rec)}
.knob.fxmini .kled{top:2px}
/* the ECO-Klang badge (§1.3): a VA track on the native fallback */
.ecob{flex:none;height:22px;padding:0 7px;border-radius:11px;display:inline-flex;align-items:center;font:700 10px/1 var(--font-ui);letter-spacing:.06em;color:var(--text-dim);border:1px solid var(--panel-edge);background:var(--lcd);white-space:nowrap}
.ecob[hidden]{display:none}
.seg.eng button.eco::before{content:"ECO";position:absolute;left:0;right:0;bottom:3px;font:700 7.5px/1 var(--font-ui);letter-spacing:.1em;color:var(--amber);text-align:center;pointer-events:none}
.seg.eng button.eco{padding-bottom:7px}
@media (orientation:portrait){ .sh-head .ecob{display:none!important} }
@media (orientation:landscape){ .seg.eng button.eco::before{display:none} .seg.eng button.eco{padding-bottom:0} }
/* CPU badge (§14.3): L/W amber chip before ≡; P: the TAKT label reads CPU */
#bCpu{color:var(--amber);border-color:#6b4c16;font-size:9px;letter-spacing:.1em;min-width:40px}
#bCpu[hidden]{display:none!important}
.takt .lbl.cpul{color:var(--amber);font-weight:700}
@media (orientation:portrait) and (max-width:359px){
  .pg.pg-fxg{gap:2px 4px}
  .pg-fxg>.lgrp.fxrow>.lbl,.pg-fx-master>.fxmode .lgrp>.lbl{min-width:0}
  .pg-fx-echo .seg.ecm button{font-size:10px;letter-spacing:0;padding:0 2px}
}
@media (orientation:portrait) and (min-width:360px) and (max-width:389px){ .pg.pg-fxg{gap:2px 10px} }
@media (orientation:portrait) and (max-width:389px){ .pg-fxg>.knob .kl.lg{font-size:9px;letter-spacing:0} .pg-fx-chorus>.fxinfo{font-size:10px;overflow-wrap:anywhere} }
/* L: one knob row + one segment row (§8.3: HALL's toggle and Pumpen go to the segment row) */
@media (orientation:landscape){
  .pg.pg-fxg{grid-template-columns:repeat(9,minmax(0,96px));gap:2px 6px}
  .pg-fxg>.lgrp.fxrow{margin-top:0}
  .pg-fx-spur>.lgrp.r1{grid-column:1/5;grid-row:2}
  .pg-fx-spur>.lgrp.r2{grid-column:5/-1;grid-row:2}
  .pg-fxg>.lgrp.fxrow>.lbl{min-width:0}
  .pg-fx-spur>.bush{grid-row:1;grid-column:7/span 3;min-height:0;height:40px}
  .pg-fx-chorus>.knob{grid-row:1}
  .pg-fx-chorus>.lgrp.r0{grid-column:4/-1;grid-row:1;align-self:start;margin:6px 0 0}
  .pg-fx-chorus>.fxinfo{grid-column:4/-1;grid-row:1;align-self:end;margin-bottom:12px}
  .pg-fx-hall>.knob.fxmini,.pg-fx-hall>.frz,.pg-fx-hall>.fxcap{grid-row:2}
  .pg-fx-hall>.knob.fxmini{grid-column:1/span 2}
  .pg-fx-hall>.frz{grid-column:3/span 2;flex-direction:row;width:auto;height:36px;justify-self:start;padding:0 10px}
  .pg-fx-hall>.fxcap{grid-column:5/-1}
  .pg-fx-hall>.fxcap br{display:none}
  .pg-fx-hall>.fxcap .fxst::before{content:" · "}
  .pg-fx-echo>.fxmode{grid-column:1/-1;grid-row:2;flex-direction:row;align-items:center;gap:12px}
  .pg-fx-echo .seg.ecm{flex:0 0 auto}
  .pg-fx-echo .seg.ecm button{flex:none;padding:0 12px}
  .pg-fx-master>.grm{grid-column:8;grid-row:1}
  .pg-fx-master>.fxmode{grid-row:2;margin-top:0;flex-wrap:nowrap}
  /* mini knob (Pumpen of the hall): label, dial and value in one 40 px row */
  .knob.fxmini{flex-direction:row;height:40px;gap:6px;align-items:center;justify-self:start}
  .knob.fxmini svg{width:34px;height:34px}
  .knob.fxmini .kl{max-width:none}
  .grm{height:88px}
}
@media (orientation:landscape){ .pg.pg-fxg{max-width:none} }
@media (orientation:landscape) and (max-width:759px){
  .pg.pg-fxg{gap:2px 2px}
  .pg-fxg>.knob .kl{font-size:10px;letter-spacing:0}
  .pg-fxg>.knob .kl.lg{font-size:9px}
  /* 5 FX sub-tabs share the 32 px row with the 6 tabs and the LCD text */
  .sh-bar.hassubs .tab{padding:0 8px}
  .sh-bar.hassubs .stab{padding:0 6px}
}
/* compact levels (fitBody) for the effect pages; :is(#…) lifts them over the sheets' own fit rules */
:is(#synthSheet,#drumSheet) .sh-body.fit1 .pg-fxg>.knob{height:78px}
:is(#synthSheet,#drumSheet) .sh-body.fit1 .pg-fxg>.knob svg{width:50px;height:50px}
:is(#synthSheet,#drumSheet) .sh-body.fit1 .pg-fxg .seg button{height:30px}
:is(#synthSheet,#drumSheet) .sh-body.fit1 .grm{height:78px}
:is(#synthSheet,#drumSheet) .sh-body.fit1 .pg-fxg>.bush{min-height:34px}
:is(#synthSheet,#drumSheet) .sh-body.fit2 .pg-fxg>.knob{height:71px}
:is(#synthSheet,#drumSheet) .sh-body.fit2 .pg-fxg>.knob svg{width:42px;height:42px}
:is(#synthSheet,#drumSheet) .sh-body.fit2 .pg-fxg .seg button{height:28px}
:is(#synthSheet,#drumSheet) .sh-body.fit2 .grm{height:71px}
:is(#synthSheet,#drumSheet) .sh-body.fit2 .pg-fxg>.lgrp.fxrow{margin-top:0}
:is(#synthSheet,#drumSheet) .sh-body.fit2 .pg.pg-fxg{row-gap:0}
:is(#synthSheet,#drumSheet) .sh-body.fit3 .pg-fxg>.knob{height:66px}
:is(#synthSheet,#drumSheet) .sh-body.fit3 .pg-fxg>.knob svg{width:38px;height:38px}
:is(#synthSheet,#drumSheet) .sh-body.fit3 .pg-fxg .seg button{height:26px}
:is(#synthSheet,#drumSheet) .sh-body.fit3 .grm{height:66px}
:is(#synthSheet,#drumSheet) .sh-body.fit3 .pg-fxg .fxcap{font-size:9px;line-height:1.15}
:is(#synthSheet,#drumSheet) .sh-body.fit3 .pg-fx-hall>.frz{height:50px;width:62px}
@media (orientation:landscape){
  :is(#synthSheet,#drumSheet) .sh-body:is(.fit1,.fit2,.fit3) .knob.fxmini{height:36px}
  :is(#synthSheet,#drumSheet) .sh-body:is(.fit1,.fit2,.fit3) .knob.fxmini svg{width:30px;height:30px}
}
</style>

<div id="app" class="audio-off loading">
  <header id="top">
    <span id="topLogo" class="tlogo"></span>
    <button id="bPlay" class="tb rb" aria-label="Start / Stopp (Leertaste)" title="Start / Stopp"><span class="g-play">▶</span><span class="g-stop">■</span><svg class="spk" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 4h2l3-3v10L3 8H1z" fill="currentColor"/><path d="M8 4l3 4M11 4L8 8" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button id="bRec" class="tb rb" aria-label="Aufnahme (lang drücken: Optionen)" title="Aufnahme – lang drücken für Optionen"><span class="dot">●</span><span id="recSub" class="sub">AUTO</span></button>
    <div id="takt" class="takt" aria-live="off">
      <div class="trow"><span class="lbl">Takt</span><span class="leds" id="leds"><i></i><i></i><i></i><i></i></span></div>

    <button id="chipLen" class="chipT rb lwonly" aria-label="Aufnahmelänge">LÄNGE<b id="chipLenv">AUTO</b></button>
    <button id="bFangT" class="chipT rb lwonly fangb" aria-label="FANG – Gespieltes einfangen">FANG ⤓</button>

    <button id="bCpu" class="chipT rb lwonly" aria-label="CPU-Last hoch – Info" hidden>CPU</button>
    <button id="bMenu" class="tb sq rb" aria-label="Menü">≡</button>
  </header>

  <section id="gridArea">

<script type="text/plain" id="sq-worklet-src">
/* SYNQUENZER synth worklet module (spec v2 1.1 block 1, 1.4, 5.4): processors 'dirigent-analog' and 'dirigent-hall'.
   Built by scratchpad/wp4work/tools/build-worklet.mjs from presetlib/analog-core-sync.js (hard sync) + the scope hunks of
   modux/analog-core-scope.js + D_UNIDET applied + deferred tempo changes + event 8 + fxresearch/fx-worklet.js;
   WP5 (scratchpad/wp5work/tools/build-worklet-wp5.mjs): {scopeDst: bool} adds the focus voice's dst sums to {scope}.
   ASCII only; it never contains the closing script tag (checked by wp4work/tools/check-worklet.mjs).
   ---------------------------------------------------------------------------------------------------------------------

// SYNQUENZER recording helpers: Capture ("FANG", like Ableton Capture MIDI) and Song (session -> arrangement) logic.
// Pure functions on beats; the app supplies its clock (audible beat) and applies results with its own launch/scheduler code.
'use strict';
const RecHelpers = (() => {
  const nextPow2 = x => { let p = 1; while (p < x) p *= 2; return p; };

  /* ---------- Capture: an always-on buffer of what was PLAYED (transport running, SPIELEN, not recording) ----------
     buf: [{track, n, v, b (absolute beat of note-on, audible clock), d (beats)}]
     Returns the last musical phrase of `track` as a clip that can be launched IN PHASE (cstart = startBeat), or null.
     Phrase = notes back from the newest one until a gap of >= gapBars of silence. Length = 1/2/4/8/16 bars, aligned to the
     bar the phrase starts in; a note played up to 1/4 beat before that bar line counts as on it (like the record early-catch). */
  function capturePhrase(buf, track, nowBeat, o = {}) {
    const gap = (o.gapBars || 1) * 4, maxBars = o.maxBars || 16;
    const ns = buf.filter(x => x.track === track && x.b <= nowBeat + 1e-6 && x.b > nowBeat - maxBars * 4 - 4).sort((a, b) => a.b - b.b);
    if (!ns.length) return null;
    let i = ns.length - 1, phraseEnd = ns[i].b + ns[i].d;
    while (i > 0 && ns[i].b - Math.max(...ns.slice(0, i).map(x => x.b + x.d)) < gap) i--;
    const ph = ns.slice(i);
    const startBar = Math.floor((ph[0].b + .25) / 4);              // early-catch window
    phraseEnd = Math.max(...ph.map(x => x.b + Math.min(x.d, 1)));  // long held notes do not stretch the loop
    const span = Math.max(1, Math.ceil((phraseEnd - .25) / 4 - 1e-9) - startBar);
    const len = Math.min(maxBars, nextPow2(span)), startBeat = startBar * 4, L = len * 4;
    const notes = ph.filter(x => x.b >= startBeat - .25 && x.b < startBeat + L)
      .map(x => ({t: +Math.max(0, x.b - startBeat).toFixed(6), d: +Math.min(Math.max(1 / 32, x.d), L).toFixed(6), n: x.n, v: x.v}));
    return {startBeat, len, notes};
  }

  /* ---------- Song: performance recording of launches/stops + Träger, editable as a bar grid ----------
     song = {bars, lanes: [[{bar, slot}]] (slot -1 = stop), carrier: [{beat, target|null}], melody: [{b, d, n, v}]}
     Every launch/stop in the app lands on a bar line (launch quantization), so a bar grid is exact. */
  function newSong(nTracks = 5) { return {bars: 0, lanes: Array.from({length: nTracks}, () => []), carrier: [], melody: []}; }
  function logLaunch(song, track, slot, beat) {
    const bar = Math.round(beat / 4), lane = song.lanes[track];
    for (let k = lane.length - 1; k >= 0; k--) if (lane[k].bar === bar) lane.splice(k, 1);   // a later decision for the same bar wins
    const prev = slotAt(song, track, bar);

  }
  function slotAt(song, track, bar) { let s = -1; for (const e of song.lanes[track]) { if (e.bar > bar) break; s = e.slot; } return s; }

  function blockStart(song, track, bar) { let st = 0; for (const e of song.lanes[track]) { if (e.bar > bar) break; st = e.bar; } return st; }
  // Events whose bar line lies in [b0, b1) beats: what the scheduler must apply as launches (R.pend) in song mode
  function eventsIn(song, b0, b1, overridden = []) {
    const out = [];
    song.lanes.forEach((lane, track) => {
      if (overridden[track]) return;                               // the user took this track over live ("↩ SONG" returns it)
      for (const e of lane) { const beat = e.bar * 4; if (beat >= b0 - 1e-9 && beat < b1 - 1e-9) out.push({track, slot: e.slot, beat}); }
    });
    if (song.bars && song.bars * 4 >= b0 - 1e-9 && song.bars * 4 < b1 - 1e-9) out.push({end: true, beat: song.bars * 4});
    return out;
  }
  // Grid view for the phone editor: cells[track][bar] = {slot, start: is a launch bar}
  function toGrid(song) {
    return song.lanes.map((lane, track) => Array.from({length: song.bars}, (_, bar) => ({slot: slotAt(song, track, bar), start: lane.some(e => e.bar === bar && e.slot >= 0)})));
  }
  // Tap in the song grid: cycles  – → 1 → 2 → 3 → 4 → –  for that bar and keeps the following bars as they were
  function cycleCell(song, track, bar, nScenes = 4) {
    const cur = slotAt(song, track, bar), next = cur >= nScenes - 1 ? -1 : cur + 1, after = slotAt(song, track, bar + 1);
    const lane = song.lanes[track];
    for (let k = lane.length - 1; k >= 0; k--) if (lane[k].bar === bar || lane[k].bar === bar + 1) lane.splice(k, 1);
    lane.push({bar, slot: next});
    if (bar + 1 < song.bars) lane.push({bar: bar + 1, slot: after});
    // drop redundant events (same slot as the bar before, unless it is an explicit relaunch at the same bar we just set)
    lane.sort((a, b) => a.bar - b.bar);
    for (let k = lane.length - 1; k >= 1; k--) if (lane[k].slot === lane[k - 1].slot && lane[k].bar !== bar) lane.splice(k, 1);
    if (lane.length && lane[0].slot === -1 && lane[0].bar === 0) lane.shift();
    return next;
  }

  function fromChain(chain, nTracks, hasClip) {

    song.bars = bar; return song;
  }
  return {capturePhrase, newSong, logLaunch, logCarrier, slotAt, blockStart, eventsIn, toGrid, cycleCell, fromChain};
})();

/* ===== §1.1 block 11: SynthHost — from scratchpad/analog-research/host.js (spec v2 §1.4, §5.4) =====
   The main-thread side of the synth worklet (block 1: processors 'dirigent-analog' and 'dirigent-hall').

                                                 guard; a probe node proves it. state 'idle'|'loading'|'ready'|'failed', how, err

       E.on(id, note, vel, t, from) · E.off(id, t) · E.fastOff(id, t, tau) · E.retune(id, note, t, tau) · E.kill(id)
       E.cancelRetune(id) · E.allOff(t) · E.panic() · E.set(diff) · E.mods(list) · E.tempo(bpm, start, at) · E.scope(on)

    const t = setTimeout(() => rej(new Error('Zeitüberschreitung')), ms);   // loader guard only, never used for audio timing
    p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });

/* ===== §1.1 block 12: FX — embedded from scratchpad/fxresearch/fx-native.js (spec v2 §8, §5.5) =====
   Embedded unchanged as a library. WP3 uses FX.TempoLFO for the native LFO 1/2 routes (§5.5); the chorus, echo, hall,

   Contents: tempo divisions, phase-shifted LFO waves, tempo-locked LFO (any shape), Juno/Ensemble/Dimension chorus,

function fmtVal(fmt, v) {
  switch (fmt) {
    case 'hz': return v < 1000 ? (v < 10 ? fmtDec(v, 2) : v < 100 ? fmtDec(v, 1) : String(Math.round(v))) + ' Hz' : fmtDec(v / 1000, v < 9950 ? 1 : 0).replace(/,0$/, '') + ' kHz';
    case 's': return v < 1 ? (v < 0.01 ? fmtDec(v * 1000, 1).replace(/,0$/, '') : String(Math.round(v * 1000))) + ' ms' : fmtDec(v, 1) + ' s';
    case 'pct': return Math.round(v * 100) + ' %';
    case 'bip': { const p = Math.round(v * 100); return (p > 0 ? '+' : p < 0 ? MINUS : '±') + Math.abs(p) + ' %'; }
    case 'pan': { const p = Math.round(v * 100); return p === 0 ? 'Mitte' : (p < 0 ? 'L ' : 'R ') + Math.abs(p); }
    case 'ratio': return '×' + String(v).replace('.', ',');
    case 'ct': return Math.round(v) + ' ct';
    case 'oct': return (v > 0 ? '+' : v < 0 ? MINUS : '±') + Math.abs(v);
    case 'num1': return fmtDec(v, 1);
    case 'st': return Math.round(v * 12) + ' HT';
    // WP3 (§5.1)
    case 'foot': return FOOT[String(v)] || String(v);
    case 'semi': { const r = Math.round(v); return (r > 0 ? '+' : r < 0 ? MINUS : '') + Math.abs(r) + ' HT'; }
    case 'sct': { const r = Math.round(v); return (r > 0 ? '+' : r < 0 ? MINUS : '') + Math.abs(r) + ' ct'; }
    case 'uni': return v + '×';
    case 'poly': return String(v);
    case 'db': { if (!(v > 0)) return MINUS + '∞ dB'; const db = 20 * Math.log10(v); return (db > .05 ? '+' : db < -.05 ? MINUS : '') + fmtDec(Math.abs(db), 1) + ' dB'; }
    case 'sync': return syncLbl(v);
    case 'wave': return WAVE_NAME[v] || String(v);
    // WP4 (§8.2)
    case 'ms': return typeof v === 'string' ? v : Math.round(v) + ' ms';
    case 'x1': return '×' + fmtDec(v, v < 10 ? 2 : 1).replace(/0$/, '');
    case 'dbv': { const r = Math.round(v * 10) / 10; return (r > 0 ? '+' : r < 0 ? MINUS : '') + fmtDec(Math.abs(r), 1).replace(/,0$/, '') + ' dB'; }
    case 'ratio2': return fmtDec(v, v < 10 ? 1 : 0).replace(/,0$/, '') + ':1';
    case 'hdec': return v >= 59 ? '∞' : fmtVal('s', v);
    case 'div': return String(v);
    default: return String(v);
  }
}

    },

/* =====================================================================
   IO: storage (SQStore KV + Autosave, §12.4), project switching (§12.2), files, MIDI export, MIDI input
   ===================================================================== */
const UI_KEY = 'synquenzer.ui', OLD_UI_KEY = 'dirigent.v2.ui';
const BOOT = {done: false, gen: 0, dirty: false};
let kv = null, autosave = null;
const idle = window.requestIdleCallback ? (f => window.requestIdleCallback(f, {timeout: 2000})) : (f => setTimeout(f, 50));   // §1.7.7
// the selection is saved with the project (§12.6 ui) and restored when the app starts or a project is opened
function syncUi() { if (S) S.ui = {selT: R.selT, selS: R.selS}; }
function serializeProject() { syncUi(); return JSON.stringify(S, stripReplacer); }
/* project file v3 (§12.1): {app:'SYNQUENZER', kind:'project', format:3, saved, appVersion, sum, project (compact notes),
   sounds:[the user library]}. lib = false for the parked projects of [Projekte] (stored without the library, §12.2) */
function projectFileObj(p, noTime, lib) {
  if (p === S) syncUi();
  const o = SQStore.buildProjectFile(p, lib ? (LIB.ok ? LIB.lib.all() : []) : null, VERSION);
  if (noTime) delete o.saved;
  return o;
}
// API: the same file without the time stamp, so equal projects serialize to equal strings (G1/G3)
function serialize() { return JSON.stringify(projectFileObj(S, true, true)); }
// marks only; the autosave serializes later (stopped: 800 ms / 4 s, playing: 2 s / 20 s with tickAhead first)
function markDirty() {
  if (!BOOT.done) { BOOT.dirty = true; return; }
  if (!autosave) return;
  if (R.playing) autosave.markDirtyPlaying(); else autosave.markDirty();
}
// old API save(): synchronous rescue copy + immediate write
// resolves true only when the project now survives a reload (false in memory mode, like the old API without storage)
function saveNow() {
  if (!autosave) return Promise.resolve(false);
  const ok = autosave.flushSync();
  const mem = !kv || kv.mode === 'memory';
  return autosave.flush().then(r => !mem && !!(r || ok), () => !mem && !!ok);
}
async function loadSaved() {
  if (!autosave || !kv || kv.mode === 'memory') return false;
  const p = await autosave.load(); if (!p) return false;
  applyProject(normalizeProject(p), {}); return true;
}
let UIP = null;
function uiPrefs() {
  if (UIP) return UIP;
  let p = null;
  try { p = JSON.parse(safeGet(UI_KEY) || 'null'); } catch (e) { p = null; }
  if (!p || typeof p !== 'object') {        // read the DIRIGENT prefs once
    p = {}; try { const o = JSON.parse(safeGet(OLD_UI_KEY) || 'null'); if (o && typeof o === 'object') Object.assign(p, o); } catch (e) {}
    p.firstUse = Date.now(); safeSet(UI_KEY, JSON.stringify(p));
  }
  UIP = p; return p;
}
function setUiPref(k, v) { const p = uiPrefs(); p[k] = v; safeSet(UI_KEY, JSON.stringify(p)); }

function applyProject(p, opts) {
  opts = opts || {};
  if (R.playing) stop();
  if (rec.state !== 'off') { rec.state = 'off'; rec.open.clear(); }
  rec.tail = null;
  fadeAll();                // sounding notes and drum tails fade out (20 ms) instead of a hard cut (click)
  closeSheets(); R.editor = null; closePop();
  if (EL.menu && EL.menu.classList.contains('open')) closeMenu();
  S = p;
  if (!S.id) S.id = newProjectId();
  BOOT.gen++;
  for (let i = 0; i < 5; i++) { R.slot[i] = S.tracks[i].clips[0] ? 0 : -1; R.pend[i] = null; R.cstart[i] = 0; R.prev[i] = null; }
  if (opts.first) { R.selT = 3; R.selS = 0; } else if (opts.ui && S.ui) { R.selT = clamp(S.ui.selT | 0, 0, 4); R.selS = clamp(S.ui.selS | 0, 0, 3); } else { R.selT = clamp(R.selT, 0, 4); R.selS = clamp(R.selS, 0, 3); }
  UI.ab = null; UI.busHint = null; previewStop();
  R.kbMode = opts.keepMode ? R.kbMode : 'play'; R.momSrc.clear(); R.momentary = false;
  T.timeline = [{time: -Infinity, target: null, shift: 0}]; T.history = []; T.held.clear(); T.gesture.clear(); T.pendingAt = null;
  syncTransposer();
  UNDO.length = 0; REDO.length = 0;
  if (AU.ctx) {
    // the old project's notes are still fading out through the track chains: swap the drive curves etc. only after
    // the fade (a curve swap on a sounding signal is a step = click)
    const busy = VOICES.some(v => !v.dead) || HITS.some(h => !h.dead);
    const applyAll = () => { for (let i = 0; i < 5; i++) { AU.tracks[i].driveAmt = -1; AU.tracks[i].lastOut = null; AU.tracks[i].prevOuts = AU.tracks[i].grpOuts = AU.tracks[i].grpT = null; applyTrackParams(i, false); } syncEngines(); applyFxBus(); applyTempoDependents(); };
    const gen = ++UI.projGen;
    if (busy) setTimeout(() => { if (gen === UI.projGen) { try { applyAll(); } catch (e) { logErr(e); } } }, 140); else applyAll();
  }
  EL.hint.hidden = !!(S.settings.hintDismissed || uiPrefs().hintDismissed);
  // WP2 key model (§4.1.4): a project from before it switches one finger to "in the key" once and is analysed once
  const mig = p._mig; if (mig) { try { delete p._mig; } catch (e) {} }
  KEYC.ver++; KEYC.cache = [null, null, null, null]; R.keyPending.clear(); CAP.buf.length = 0; CAP.open.clear(); CAP.last.fill(-1e9);
  if (UI.coach) { EL.coach.hidden = true; UI.coach = false; }
  scheduleAutoKey();
  if (mig && mig.single && !opts.first) setTimeout(() => toast('Transponieren: Ein Ton bleibt jetzt in der Tonart (wie OP-Z). Umstellen: Menü → Harmonie'), 1900);
  UI.dirty.all = true; UI.kbRelayout = true;
  if (!opts.clean || mig) markDirty();
}

/* ---------- projects (§12.2): the open project lives in the autosave; parked ones under proj:<id>, index in projIndex ---------- */
const PROJ = {index: null};
async function projIndexLoad() {
  if (PROJ.index) return PROJ.index;
  let v = null; try { v = kv ? await kv.get('projIndex') : null; } catch (e) { v = null; }
  if (!PROJ.index) PROJ.index = Array.isArray(v) ? v.filter(x => x && typeof x.id === 'string') : [];
  return PROJ.index;
}
async function projIndexSave() { if (!kv) return false; try { await kv.set('projIndex', PROJ.index || []); return true; } catch (e) { return false; } }
function projBars(p) { let n = 0; for (let s = 0; s < 4; s++) { let L = 0; for (const tr of (p && p.tracks) || []) { const c = tr && tr.clips && tr.clips[s]; if (c && c.len) L = Math.max(L, c.len); } n += L; } return n; }
// a project nobody worked on (fresh "Neu" or untouched demo) is not worth a place in the list
function isPristine(p) {
  try {
    const strip = o => { const x = JSON.parse(JSON.stringify(o, stripReplacer)); delete x.id; delete x.ui; return JSON.stringify(x); };
    const me = strip(p);
    return me === strip(newProject()) || me === strip(demoProject());
  } catch (e) { return false; }
}
function largestParked() { const ix = PROJ.index || []; let b = null; for (const e of ix) if (!b || (e.size || 0) > (b.size || 0)) b = e; return b; }
async function parkFile(fo) {
  if (!kv || kv.mode === 'memory') return false;
  const id = fo.project.id, size = JSON.stringify(fo).length;
  try { await kv.set('proj:' + id, fo); }
  catch (e) {                              // quota: the history goes first, then one retry
    try { for (const k of await kv.keys('hist:')) await kv.del(k); await kv.set('proj:' + id, fo); }
    catch (e2) { const big = largestParked(); toast('Speicher voll' + (big ? ' – größtes Projekt: „' + big.name + '“' : '') + ' – bitte als Datei sichern'); return false; }
  }
  const ix = await projIndexLoad(), e = {id, name: fo.project.name || 'Projekt', mt: Date.now(), bars: projBars(fo.project), size};
  const i = ix.findIndex(x => x.id === id); if (i >= 0) ix[i] = e; else ix.push(e);
  await projIndexSave();
  return true;
}
// park the open project (a synchronous snapshot; tickAhead first while playing), unless nobody worked on it
function parkCurrent() {
  if (!kv || kv.mode === 'memory' || !BOOT.done) return Promise.resolve(false);
  if (isPristine(S)) return Promise.resolve(false);
  if (R.playing) tickAhead(.3);
  return parkFile(projectFileObj(S));
}
// [Neu], [Demo laden], [Datei öffnen], open from [Projekte]: switching never loses work (§12.2). The new project is
// applied at once (the API and UI see it synchronously); the park write of the old one runs in the background.
function switchProject(p, opts) {
  const parked = parkCurrent();
  applyProject(p, opts);
  return parked.then(r => { if (autosave) autosave.flush(); return r; }, () => false);
}
async function openProject(id) {
  if (!kv || kv.mode === 'memory') return false;
  if (id === S.id) return true;
  let fo = null; try { fo = await kv.get('proj:' + id); } catch (e) { fo = null; }
  const ix = await projIndexLoad();
  const p = fo && fo.project ? projFromFile(fo) : null;
  if (!p) { PROJ.index = ix.filter(x => x.id !== id); await projIndexSave(); toast('Projekt nicht gefunden'); return false; }
  p.id = id;
  await switchProject(p, {ui: true});
  if (autosave) await autosave.flush();
  // its home is now the autosave: it is the open project (move, not copy)
  try { await kv.del('proj:' + id); } catch (e) {}
  PROJ.index = (await projIndexLoad()).filter(x => x.id !== id); await projIndexSave();
  toast('Projekt „' + p.name + '“ geöffnet');
  return true;
}
async function projectsList() {
  const ix = (await projIndexLoad()).filter(e => e.id !== S.id).sort((a, b) => b.mt - a.mt);
  return [{id: S.id, name: S.name, mt: autosave && autosave.lastOk ? autosave.lastOk : Date.now(), open: true}].concat(ix.map(e => ({id: e.id, name: e.name, mt: e.mt, open: false})));
}
async function deleteProject(id) {
